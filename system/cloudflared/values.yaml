app-template:
  controllers:
    cloudflared:
      replicas: 2
      # Keep existing tunnels available while loading the scoped Meowdoku rule.
      strategy: RollingUpdate
      rollingUpdate:
        surge: 1
        unavailable: "0"
      containers:
        app:
          image:
            repository: docker.io/cloudflare/cloudflared
            tag: 2026.5.2
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - run
          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 2000
                periodSeconds: 2
                timeoutSeconds: 2
                failureThreshold: 3
  configMaps:
    config:
      enabled: true
      data:
        config.yaml: |
          tunnel: homelab
          credentials-file: /etc/cloudflared/credentials.json
          metrics: 0.0.0.0:2000
          no-autoupdate: true
          ingress:
            - hostname: 'citadel.eaglepass.io'
              service: https://command-central.tail18136a.ts.net:443
              originRequest:
                noTLSVerify: true
            - hostname: 'hermes-webhook.eaglepass.io'
              service: http://10.0.30.100:8644
              originRequest:
                noTLSVerify: true
            - hostname: 'builder.eaglepass.io'
              service: http://45.33.2.134:3000
              originRequest:
                httpHostHeader: builder.eaglepass.io
            - hostname: 'meowdoku-preview.eaglepass.io'
              service: https://ingress-nginx-controller.ingress-nginx:443
              originRequest:
                originServerName: meowdoku-preview.eaglepass.io
                httpHostHeader: meowdoku-preview.eaglepass.io
                noTLSVerify: false
            - hostname: '*.eaglepass.io'
              service: https://ingress-nginx-controller.ingress-nginx
              originRequest:
                noTLSVerify: true
            - service: http_status:404
  persistence:
    config:
      enabled: true
      type: configMap
      name: cloudflared
      globalMounts:
        - path: /etc/cloudflared/config.yaml
          subPath: config.yaml
    credentials:
      enabled: true
      type: secret
      name: cloudflared-credentials
      globalMounts:
        - path: /etc/cloudflared/credentials.json
          subPath: credentials.json
