maintenanceRecovery:
  alertmanagerClaimEnabled: true
  alertmanagerSeedEnabled: false
  alertmanagerManifestSHA256: "66ac574e91f9ffdf26ab793871c157ced26651e94db3044317603f8b484ff69e"
  alertmanagerClaimUID: "a3b7362e-f5fb-4db4-8979-5f568ec4be6b"
  alertmanagerPVName: "pvc-a3b7362e-f5fb-4db4-8979-5f568ec4be6b"
  alertmanagerPVUID: "b2ed3855-9157-4a9a-979a-f93ed7bd1756"
  prometheusClaimEnabled: true
  prometheusSeedEnabled: false
  prometheusClaimUID: "5d3f4f44-6907-4ccf-adb3-0bb6923649a1"
  prometheusPVName: "pvc-5d3f4f44-6907-4ccf-adb3-0bb6923649a1"
  prometheusPVUID: "c3d3fdf7-6204-4942-826a-b139a43fa185"
kube-prometheus-stack:
  # k3s embeds the scheduler and controller manager and runs Cilium as the
  # kube-proxy replacement, so these upstream scrape targets do not exist.
  defaultRules:
    rules:
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
  kubeControllerManager:
    enabled: false
  kubeProxy:
    enabled: false
  kubeScheduler:
    enabled: false
  prometheusOperator:
    admissionWebhooks:
      enabled: false
      patch:
        enabled: false
    image:
      registry: quay.io
      repository: prometheus-operator/prometheus-operator
      tag: v0.92.0
      sha: "3db296f8aca7b3abbcbb79afac165abfe08212ad54f4301c88f68f079ec9d9b7"
      pullPolicy: IfNotPresent
    prometheusConfigReloader:
      image:
        registry: quay.io
        repository: prometheus-operator/prometheus-config-reloader
        tag: v0.92.0
        sha: "3c48ed36b8a6a73a0b11a6e90a194fabf4069e76f32a44fece174b4d64e8ab0f"
  kube-state-metrics:
    image:
      registry: registry.k8s.io
      repository: kube-state-metrics/kube-state-metrics
      tag: v2.19.0
      sha: ''
      pullPolicy: IfNotPresent
  prometheus-node-exporter:
    # Read-only host process collectors must cross the host SELinux boundary.
    containerSecurityContext:
      seLinuxOptions:
        type: spc_t
    image:
      registry: quay.io
      repository: prometheus/node-exporter
      tag: v1.11.1-distroless
      distroless: false
      pullPolicy: IfNotPresent
      digest: ''
  grafana:
    enabled: false
    forceDeployDatasources: true
    forceDeployDashboards: true
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki.loki:3100
  prometheus:
    prometheusSpec:
      replicas: 1
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
      storageSpec:
        volumeClaimTemplate:
          metadata:
            name: prometheus-monitoring-system-kube-pro-prometheus-db
            annotations:
              helm.sh/resource-policy: keep
              argocd.argoproj.io/sync-options: Prune=false,Delete=false
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: standard-rwo
            resources:
              requests:
                storage: 40Gi
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
  alertmanager:
    alertmanagerSpec:
      image:
        registry: quay.io
        repository: prometheus/alertmanager
        tag: v0.33.0
        sha: "af26fbe4dd1886ac0efd7bd55cd9027da262e105b137a376522b7c14c3626e4a"
        pullPolicy: IfNotPresent
      replicas: 1
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
      storage:
        volumeClaimTemplate:
          metadata:
            name: alertmanager-monitoring-system-kube-pro-alertmanager-db
            annotations:
              helm.sh/resource-policy: keep
              argocd.argoproj.io/sync-options: Prune=false,Delete=false
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: standard-rwo
            resources:
              requests:
                storage: 2Gi
      containers:
        - name: ntfy-relay
          image: ghcr.io/khuedoan/webhook-transformer:v0.0.3
          args:
            - --port=8081
            - --config=/config/alertmanager-to-ntfy.jsonnet
            - --upstream-host=https://ntfy.sh
          envFrom:
            - secretRef:
                name: webhook-transformer
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: webhook-transformer
    config:
      route:
        receiver: ntfy
        group_by:
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          - receiver: ntfy
            matchers:
              - alertname = "Watchdog"
      receivers:
        - name: ntfy
          webhook_configs:
            - url: http://localhost:8081
              send_resolved: true
