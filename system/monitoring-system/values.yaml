maintenanceRecovery:
  alertmanagerClaimEnabled: true
  alertmanagerSeedEnabled: false
  alertmanagerManifestSHA256: "66ac574e91f9ffdf26ab793871c157ced26651e94db3044317603f8b484ff69e"
  alertmanagerClaimUID: "a3b7362e-f5fb-4db4-8979-5f568ec4be6b"
  alertmanagerPVName: "pvc-a3b7362e-f5fb-4db4-8979-5f568ec4be6b"
  alertmanagerPVUID: "b2ed3855-9157-4a9a-979a-f93ed7bd1756"
  prometheusClaimEnabled: true
  prometheusSeedEnabled: false
  prometheusClaimUID: "5d3f4f44-6907-4ccf-adb3-0bb6923649a1"
  prometheusPVName: "pvc-5d3f4f44-6907-4ccf-adb3-0bb6923649a1"
  prometheusPVUID: "c3d3fdf7-6204-4942-826a-b139a43fa185"
kube-prometheus-stack:
  # k3s embeds the scheduler and controller manager and runs Cilium as the
  # kube-proxy replacement, so these upstream scrape targets do not exist.
  defaultRules:
    rules:
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
  kubeControllerManager:
    enabled: false
  kubeProxy:
    enabled: false
  kubeScheduler:
    enabled: false
  prometheusOperator:
    admissionWebhooks:
      enabled: false
      patch:
        enabled: false
  grafana:
    enabled: false
    forceDeployDatasources: true
    forceDeployDashboards: true
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki.loki:3100
  prometheus:
    prometheusSpec:
      replicas: 1
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
      storageSpec:
        volumeClaimTemplate:
          metadata:
            name: prometheus-monitoring-system-kube-pro-prometheus-db
            annotations:
              helm.sh/resource-policy: keep
              argocd.argoproj.io/sync-options: Prune=false,Delete=false
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: standard-rwo
            resources:
              requests:
                storage: 40Gi
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
  alertmanager:
    alertmanagerSpec:
      replicas: 0
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
      storage:
        volumeClaimTemplate:
          metadata:
            name: alertmanager-monitoring-system-kube-pro-alertmanager-db
            annotations:
              helm.sh/resource-policy: keep
              argocd.argoproj.io/sync-options: Prune=false,Delete=false
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: standard-rwo
            resources:
              requests:
                storage: 2Gi
      containers:
        - name: ntfy-relay
          image: ghcr.io/khuedoan/webhook-transformer:v0.0.3
          args:
            - --port=8081
            - --config=/config/alertmanager-to-ntfy.jsonnet
            - --upstream-host=https://ntfy.sh
          envFrom:
            - secretRef:
                name: webhook-transformer
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: webhook-transformer
    config:
      route:
        receiver: maintenance-null
        routes: []
        group_by:
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
      receivers:
        - name: maintenance-null
