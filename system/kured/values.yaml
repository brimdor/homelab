kured:
  metrics:
    create: true

  # Tolerations to ensure kured runs on all nodes including those with dedicated taints
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      effect: NoSchedule
    - key: dedicated
      operator: Exists
      effect: NoSchedule

  # Ensure no node affinity exclusions - kured should run on ALL nodes
  affinity: {}

  configuration:
    # Preserve file-based reboot detection; no host diagnostic script is needed.
    useRebootSentinelHostPath: true
    period: 5m
    rebootDays: [mo, we, fr]
    startTime: 1:45
    endTime: 7:00
    timeZone: America/Chicago
    concurrency: 1
    annotateNodes: true
    preferNoScheduleTaint: homelab.eaglepass.io/rebooting
    lockReleaseDelay: 10m
    drainTimeout: 20m
