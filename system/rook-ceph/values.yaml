    namespace: rook-ceph
    driverSpecDefaults:
      cephFsClientType: kernel
      clusterName: rook-ceph
      controllerPlugin:
        affinity:
          nodeAffinity: {}
        deploymentStrategy:
          type: Recreate
        hostNetwork: false
        imagePullPolicy: IfNotPresent
        priorityClassName: system-node-critical
        replicas: 2
        resources: {}
        tolerations:
          - effect: NoSchedule
            key: dedicated
            operator: Exists
      deployCsiAddons: false
      enableMetadata: false
      fsGroupPolicy: File
      generateOMapInfo: false
      imageSet:
        # Change this digest-bound reference with the plugin pin; CSI does not watch its ConfigMap.
        name: rook-csi-images-0b62db8afc9b
      log:
        rotation:
          enabled: false
      nodePlugin:
        affinity:
          nodeAffinity: {}
        enableSeLinuxHostMount: false
        imagePullPolicy: IfNotPresent
        kubeletDirPath: /var/lib/kubelet
        priorityClassName: system-cluster-critical
        resources: {}
        tolerations:
          - effect: NoSchedule
            key: dedicated
            operator: Exists
  drivers:
    rbd:
      enabled: true
      name: rook-ceph.rbd.csi.ceph.com
      cephFsClientType: kernel
      clusterName: rook-ceph
      controllerPlugin:
        affinity:
          nodeAffinity: {}
        imagePullPolicy: IfNotPresent
        priorityClassName: system-node-critical
        replicas: 2
        resources:
          attacher:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          omapGenerator:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          plugin:
            limits:
              memory: 1Gi
            requests:
              memory: 512Mi
          provisioner:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          resizer:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          snapshotter:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
        tolerations:
          - effect: NoSchedule
            key: dedicated
            operator: Exists
        hostNetwork: false
      deployCsiAddons: false
      enableMetadata: false
      fsGroupPolicy: File
      generateOMapInfo: false
      imageSet:
        name: rook-csi-images-0b62db8afc9b
      log:
        rotation:
          enabled: false
      nodePlugin:
        affinity:
          nodeAffinity: {}
        enableSeLinuxHostMount: false
        imagePullPolicy: IfNotPresent
        kubeletDirPath: /var/lib/kubelet
        priorityClassName: system-cluster-critical
        resources:
          plugin:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          registrar:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
        tolerations:
          - effect: NoSchedule
            key: dedicated
            operator: Exists
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
      snapshotPolicy: volumeSnapshot
    cephfs:
      enabled: true
      name: rook-ceph.cephfs.csi.ceph.com
      cephFsClientType: kernel
      clusterName: rook-ceph
      controllerPlugin:
        affinity:
          nodeAffinity: {}
        imagePullPolicy: IfNotPresent
        priorityClassName: system-node-critical
        replicas: 2
        resources:
          attacher:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          plugin:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          provisioner:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          resizer:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          snapshotter:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
