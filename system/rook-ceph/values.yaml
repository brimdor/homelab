            key: dedicated
            operator: Exists
        hostNetwork: false
      deployCsiAddons: false
      enableMetadata: false
      fsGroupPolicy: File
      generateOMapInfo: false
      imageSet:
        name: rook-csi-images-0b62db8afc9b
      log:
        rotation:
