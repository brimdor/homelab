rook-ceph:
  # Supported Rook mode for SELinux-restricted Ceph hostPaths.
  hostpathRequiresPrivileged: true
  monitoring:
    enabled: true
  csi:
    # The default EL10 image requires AVX unavailable under GDS mitigation.
    # Verified v3.17.1 uses EL9 and supports Ceph AES256K keys.
    cephcsi:
      repository: quay.io/cephcsi/cephcsi
      tag: v3.17.1@sha256:0b62db8afc9b174619186c87084a8952157daa719415c598603be22b63cc1293
    pluginTolerations:
      - key: dedicated
        operator: Exists
        effect: NoSchedule
    provisionerTolerations:
      - key: dedicated
        operator: Exists
        effect: NoSchedule
  discover:
    tolerations:
      - key: dedicated
        operator: Exists
        effect: NoSchedule
rook-ceph-cluster:
  toolbox:
    enabled: true
    # An absent optional key omits the legacy env var; the watcher uses its file.
    additionalEnv:
      - name: ROOK_CEPH_SECRET
        valueFrom:
          secretKeyRef:
            name: rook-ceph-mon
            key: toolbox-legacy-env-disabled
            optional: true
    # Match the Ceph daemon CLI, not the Rook operator version.
    image: quay.io/ceph/ceph:v20.2.4-20260818@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9
  monitoring:
    # Ceph v20.2.1 contains the Rook prometheus-module fix that blocked this
    # integration on v20.2.0.
    enabled: true
    createPrometheusRules: true
    prometheusRuleOverrides:
      # kube-prometheus-stack already owns node filesystem capacity alerts with
      # current free-space gates; the Ceph duplicate remains firing for up to
      # 48 hours after a successful image-prune recovery.
      CephNodeDiskspaceWarning:
        disabled: true
  cephClusterSpec:
    cephVersion:
      image: quay.io/ceph/ceph:v20.2.4-20260818@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9
      imagePullPolicy: IfNotPresent
    storage:
      useAllNodes: false
      useAllDevices: true
      nodes:
        - name: arcanine
          # osd.2 on arcanine:sda was raising recurring BlueFS stalled-read alerts;
          # pin Ceph to the dedicated Samsung data SSD and exclude the shared boot disk.
          devices:
            - name: sdb
        # bulbasaur excluded: osd.4 device has recurring BlueFS stalled-read alerts
        - name: cyndaquil
        - name: growlithe
        - name: sprigatito
    placement:
      all:
        tolerations:
          - key: dedicated
            operator: Exists
    mon:
      count: 3
    mgr:
      count: 2
      # Rook recommends disabling this optional module for Tentacle stability.
      modules:
        - name: rook
          enabled: false
    # Preserve the existing transport and client keys during chart adoption.
    network:
      connections:
        requireMsgr2: false
    security:
      cephx:
        # Current core/MDS generations are at most 1; rotate during this upgrade.
        daemon:
          keyRotationPolicy: KeyGeneration
          keyGeneration: 2
        csi:
          keyType: aes
    dashboard:
      ssl: false
    healthCheck:
      livenessProbe:
        mon:
          probe:
            timeoutSeconds: 10
    logCollector:
      enabled: false
    # In-place host maintenance must never remove a returning OSD automatically.
    removeOSDsIfOutAndSafeToRemove: false
    disruptionManagement:
      managePodBudgets: true
      osdMaintenanceTimeout: 90
    resources:
      mgr:
        limits:
          memory: "1Gi"
        requests:
          cpu: "100m"
          memory: "512Mi"
      mon:
        limits:
          memory: "2Gi"
        requests:
          cpu: "100m"
          memory: "100Mi"
      osd:
        limits:
          memory: "4Gi"
        requests:
          cpu: "100m"
          memory: "512Mi"
  cephBlockPools:
    - name: standard-rwo
      spec:
        replicated:
          size: 2
      storageClass:
        enabled: true
        name: standard-rwo
        isDefault: true
        allowVolumeExpansion: true
        parameters:
          imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
          csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
          csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
  cephBlockPoolsVolumeSnapshotClass:
    enabled: true
    isDefault: true
  cephFileSystems:
    - name: standard-rwx
      spec:
        metadataPool:
          replicated:
            size: 2
        dataPools:
          - name: data0
            replicated:
              size: 2
        metadataServer:
          activeCount: 1
          activeStandby: true
          resources:
            limits:
              memory: "4Gi"
            requests:
              cpu: "100m"
              memory: "100Mi"
          priorityClassName: system-cluster-critical
      storageClass:
        enabled: true
        name: standard-rwx
        isDefault: false
        allowVolumeExpansion: true
        pool: data0
        parameters:
          csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
          csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
  cephFileSystemVolumeSnapshotClass:
    enabled: true
    isDefault: false
  cephObjectStores: []

snapshot-controller:
  webhook:
    tls:
      # Cert-manager owns TLS; offline Helm renders must not rotate the serving key.
      autogenerate: false
      certManagerIssuerRef:
        name: rook-ceph-snapshot-webhook
        kind: Issuer
        group: cert-manager.io

# Temporary synthetic volumes only; disable and prune after UID-bound acceptance.
maintenanceCsiProbe:
  enabled: false

pvcHygiene:
  enabled: true
  schedule: "0 3 * * *"
  image: bitnami/kubectl:latest@sha256:dbe04f493d362c47db291edb3382aeb56cf430a6271daa56311f5b8e82fecf2a
  mode: report
  minAgeHours: 168
  approvedDeleteAnnotation: homelab.eaglepass.io/pvc-prune
  approvedDeleteValue: approved
  ignoredNamespaces:
    - kube-system
    - rook-ceph
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

ceph-csi-drivers:
