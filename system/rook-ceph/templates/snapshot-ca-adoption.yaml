# One-time issuance: cert-manager can accept an existing certificate without checking its issuer chain.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: snapshot-ca-adoption
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: snapshot-ca-adoption
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    resourceNames: [rook-ceph-conversion-webhook]
    verbs: [get]
  - apiGroups: [cert-manager.io]
    resources: [certificates/status]
    resourceNames: [rook-ceph-conversion-webhook]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: snapshot-ca-adoption
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: snapshot-ca-adoption
subjects:
  - kind: ServiceAccount
    name: snapshot-ca-adoption
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: snapshot-ca-adoption
  namespace: {{ .Release.Namespace }}
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: serviceaccount
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: cluster
        context:
          cluster: cluster
          user: serviceaccount
          namespace: {{ .Release.Namespace }}
    current-context: cluster
---
apiVersion: batch/v1
kind: Job
metadata:
  name: snapshot-serving-ca-adoption-v2
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    spec:
      serviceAccountName: snapshot-ca-adoption
      restartPolicy: Never
      volumes:
        - name: kubeconfig
          configMap:
            name: snapshot-ca-adoption
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: renew
          image: quay.io/jetstack/cmctl:v2.6.1@sha256:e5b5f53fede34dc1da14b9d1dac4c01f7a6030704f4fe362b7b486304976b1b6
          args:
            - --kubeconfig=/etc/cmctl/config
            - renew
            - rook-ceph-conversion-webhook
            - --namespace={{ .Release.Namespace }}
            - --request-timeout=30s
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/cmctl
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
