# Preserve this identity until cert-manager owns its data; never commit key material.
apiVersion: v1
kind: Secret
metadata:
  name: rook-ceph-conversion-webhook
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: kubernetes.io/tls
