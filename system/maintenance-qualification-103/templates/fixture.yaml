apiVersion: v1
kind: Namespace
metadata:
  name: maintenance-qualification-103
  labels:
    homelab.eaglepass.io/qualification: maintenance-103
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: no-pods
  namespace: maintenance-qualification-103
spec:
  hard:
    pods: "0"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: no-network
  namespace: maintenance-qualification-103
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kured-owner-fixture
  namespace: maintenance-qualification-103
  labels:
    homelab.eaglepass.io/qualification: maintenance-103
  annotations:
    homelab.eaglepass.io/qualification-revision: {{ .Values.qualificationRevision | quote }}
spec:
  selector:
    matchLabels:
      app: kured-owner-fixture
  template:
    metadata:
      labels:
        app: kured-owner-fixture
    spec:
      nodeSelector:
        homelab.eaglepass.io/qualification-103: never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture
          image: ghcr.io/kubereboot/kured:1.21.0@sha256:76567a71427b074bfc51df6797c8c30ba44c9678ace7cd61a186ddb662ce97b1
          command: [/usr/bin/kured, --version]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
