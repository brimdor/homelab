analytics:
  reporting_enabled: false
auth_enabled: false
chunk_store_config: {}
compactor:
  working_directory: /var/loki/loki/boltdb-shipper-compactor
ingester:
  chunk_block_size: 262144
  chunk_idle_period: 3m
  chunk_retain_period: 1m
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  wal:
    dir: /var/loki/loki/wal
limits_config:
  allow_structured_metadata: false
  discover_service_name: []
  max_entries_limit_per_query: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 168h
memberlist:
  join_members: []
schema_config:
  configs:
    - from: '2020-10-24'
      index:
        period: 24h
        prefix: index_
      object_store: filesystem
      schema: v11
      store: boltdb-shipper
    - from: '2026-10-20'
      index:
        period: 24h
        prefix: index_
      object_store: filesystem
      schema: v13
      store: tsdb
server:
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9095
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
storage_config:
  boltdb_shipper:
    active_index_directory: /var/loki/loki/boltdb-shipper-active
    cache_location: /var/loki/loki/boltdb-shipper-cache
    cache_ttl: 24h
  filesystem:
    directory: /var/loki/loki/chunks
  tsdb_shipper:
    active_index_directory: /var/loki/loki/tsdb-active
    cache_location: /var/loki/loki/tsdb-cache
table_manager:
  retention_deletes_enabled: false
  retention_period: 0s
