{{- if .Values.maintenanceRecovery.enabled }}
{{- range $claim := list (dict "name" "loki-recovery" "size" "2Gi") (dict "name" "loki-data" "size" "10Gi") }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim.name }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: {{ $claim.size }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-store-recovery
data:
  recovery.py: |
{{ .Files.Get "scripts/recovery.py" | indent 4 }}
  cold_recovery.py: |
{{ .Files.Get "scripts/cold_recovery.py" | indent 4 }}
  buffer_transfer.py: |
{{ .Files.Get "scripts/buffer_transfer.py" | indent 4 }}
  source-final-windows.json: |
{{ .Files.Get "files/source-final-windows.json" | indent 4 }}
  loki.yaml: |
{{ .Files.Get "files/recovery-loki.yaml" | indent 4 }}
  candidate.yaml: |
{{ .Files.Get "files/candidate-loki.yaml" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki-store-recovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loki-store-recovery
rules:
  - apiGroups: [""]
    resources: [pods]
    resourceNames: [loki-0]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [apps]
    resources: [daemonsets]
    resourceNames: [loki-promtail]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    resourceNames: [loki-data]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    resourceNames: [loki-cutover-buffer]
    verbs: [get]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [loki, loki-cutover-buffer]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [loki-alloy]
    verbs: [get]
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [loki]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loki-store-recovery
subjects:
  - kind: ServiceAccount
    name: loki-store-recovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loki-store-recovery
{{- if .Values.maintenanceRecovery.backupEnabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-store-backup-20261019
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-store-recovery
    spec:
      restartPolicy: Never
      serviceAccountName: loki-store-recovery
      nodeSelector:
        kubernetes.io/hostname: totodile
      containers:
        - name: backup
          image: docker.io/library/python:3.13.9-alpine3.22@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command: [python3, -B, /scripts/recovery.py, backup]
          args: [{{ printf "--source-uid=%s" .Values.maintenanceRecovery.sourcePodUID | quote }}]
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [DAC_READ_SEARCH]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: recovery
              mountPath: /recovery
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: source
          hostPath:
            path: /var/lib/kubelet/pods/{{ .Values.maintenanceRecovery.sourcePodUID }}/volumes/kubernetes.io~empty-dir/storage
            type: Directory
        - name: recovery
          persistentVolumeClaim:
            claimName: loki-recovery
        - name: script
          configMap:
            name: loki-store-recovery
{{- end }}
{{- if .Values.maintenanceRecovery.serviceVerifyEnabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-cold-service-verify-20261019
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-store-recovery
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: verify
          image: docker.io/library/python:3.13.9-alpine3.22@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command: [python3, -B, /scripts/recovery.py, verify-service]
          args: [--point=pre-upgrade-offline-20261019]
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: recovery
              mountPath: /recovery
              readOnly: true
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: recovery
          persistentVolumeClaim:
            claimName: loki-recovery
            readOnly: true
        - name: script
          configMap:
            name: loki-store-recovery
{{- end }}
{{- if .Values.maintenanceRecovery.restoreEnabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-store-restore-20261019
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-store-recovery
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: totodile
      initContainers:
        - name: prepare
          image: docker.io/library/python:3.13.9-alpine3.22@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command: [python3, -B, /scripts/recovery.py, prepare]
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_READ_SEARCH]
          volumeMounts:
            - name: recovery
              mountPath: /recovery
              readOnly: true
            - name: target
              mountPath: /target
            - name: script
              mountPath: /scripts
              readOnly: true
        - name: loki-restore
          image: docker.io/grafana/loki:2.6.1@sha256:1ee60f980950b00e505bd564b40f720132a0653b110e993043bb5940673d060a
          args: [-config.file=/scripts/loki.yaml]
          restartPolicy: Always
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: target
              mountPath: /data
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: temporary
              mountPath: /tmp
      containers:
        - name: verify
          image: docker.io/library/python:3.13.9-alpine3.22@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command: [python3, -B, /scripts/recovery.py, verify]
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: recovery
              mountPath: /recovery
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: recovery
          persistentVolumeClaim:
            claimName: loki-recovery
        - name: target
          persistentVolumeClaim:
            claimName: loki-data
        - name: script
          configMap:
            name: loki-store-recovery
        - name: temporary
          emptyDir: {}
{{- end }}
{{- end }}
