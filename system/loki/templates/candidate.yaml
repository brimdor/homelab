{{- if .Values.maintenanceRecovery.candidateEnabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-upgrade-validation
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-upgrade-verify
data:
  recovery.py: |
{{ .Files.Get "scripts/recovery.py" | indent 4 }}
  candidate.yaml: |
{{ .Files.Get "files/candidate-loki.yaml" | indent 4 }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-upgrade-verify-20261019
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-upgrade-verify
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: totodile
      initContainers:
        - name: prepare
          image: docker.io/library/python:3.13.9-alpine3.22@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command: [python3, -B, /scripts/recovery.py, prepare]
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_READ_SEARCH]
          volumeMounts:
            - name: recovery
              mountPath: /recovery
              readOnly: true
            - name: target
              mountPath: /target
            - name: script
              mountPath: /scripts
              readOnly: true
        - name: loki-restore
          image: docker.io/grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
          args: [-config.file=/scripts/candidate.yaml]
          restartPolicy: Always
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: target
              mountPath: /var/loki
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: temporary
              mountPath: /tmp
      containers:
        - name: verify
          image: docker.io/library/python:3.13.9-alpine3.22@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command: [python3, -B, /scripts/recovery.py, verify-candidate]
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: recovery
              mountPath: /recovery
              readOnly: true
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: recovery
          persistentVolumeClaim:
            claimName: loki-recovery
            readOnly: true
        - name: target
          persistentVolumeClaim:
            claimName: loki-upgrade-validation
        - name: script
          configMap:
            name: loki-upgrade-verify
        - name: temporary
          emptyDir: {}
{{- end }}
