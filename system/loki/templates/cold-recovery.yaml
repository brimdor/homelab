{{- range $mode := list "capture" "copy" }}
{{- $enabled := ternary $.Values.maintenanceRecovery.coldCaptureEnabled $.Values.maintenanceRecovery.coldBackupEnabled (eq $mode "capture") }}
{{- if $enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-cold-{{ ternary "capture" "backup" (eq $mode "capture") }}-20261019
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-store-recovery
    spec:
      restartPolicy: Never
      serviceAccountName: loki-store-recovery
      nodeSelector:
        kubernetes.io/hostname: pikachu
      containers:
        - name: backup
          image: docker.io/library/python:3.13.9-alpine3.22@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command: [python3, -B, /scripts/cold_recovery.py, {{ $mode }}]
          args: [--source-uid=8229c484-d7fe-46ea-8320-77be43b24410, --source-pvc-uid=656cee92-dc36-4fc8-8742-b691c670cf77]
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [DAC_READ_SEARCH]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            {{- if eq $mode "copy" }}
            - name: source
              mountPath: /source
              readOnly: true
            {{- end }}
            - name: recovery
              mountPath: /recovery
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        {{- if eq $mode "copy" }}
        - name: source
          persistentVolumeClaim:
            claimName: loki-data
        {{- end }}
        - name: recovery
          persistentVolumeClaim:
            claimName: loki-recovery
        - name: script
          configMap:
            name: loki-store-recovery
{{- end }}
{{- end }}
