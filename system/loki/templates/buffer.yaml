{{- if .Values.maintenanceRecovery.bufferEnabled }}
# A separate persisted receiver keeps collection active during the cold backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-cutover-buffer
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-cutover-buffer
data:
  loki.yaml: |
{{ .Files.Get "files/buffer-loki.yaml" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: loki-cutover-buffer
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 3100
      targetPort: http-metrics
  selector:
    app.kubernetes.io/name: loki-cutover-buffer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki-cutover-buffer
spec:
  replicas: 1
  serviceName: loki-cutover-buffer
  selector:
    matchLabels:
      app.kubernetes.io/name: loki-cutover-buffer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-cutover-buffer
      annotations:
        checksum/config: {{ .Files.Get "files/buffer-loki.yaml" | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kubernetes.io/hostname: totodile
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: loki
          image: docker.io/grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
          args: [-config.file=/etc/loki/loki.yaml]
          ports:
            - name: http-metrics
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/loki
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: loki-cutover-buffer
        - name: config
          configMap:
            name: loki-cutover-buffer
        - name: temporary
          emptyDir: {}
{{- end }}
