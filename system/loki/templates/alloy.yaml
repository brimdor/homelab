# Legacy discovery labels and resource names preserve immutable collector identity.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alloy
  namespace: {{ .Release.Namespace }}
data:
  config.alloy: |
{{ .Files.Get "files/config.alloy" | indent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  # Preserve the existing selector, RBAC and one-at-a-time replacement boundary.
  name: loki-promtail
  namespace: {{ .Release.Namespace }}
  labels:
    helm.sh/chart: promtail-6.17.0
    app.kubernetes.io/name: promtail
    app.kubernetes.io/instance: loki
    app.kubernetes.io/version: 3.5.1
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
      app.kubernetes.io/instance: loki
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      annotations:
        checksum/alloy-config: {{ .Files.Get "files/config.alloy" | sha256sum | quote }}
      labels:
        app.kubernetes.io/instance: loki
        app.kubernetes.io/name: promtail
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - run
            - --disable-reporting
            - --server.http.listen-addr=0.0.0.0:3101
            - --storage.path=/run/alloy-loki
            - /etc/alloy/config.alloy
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          image: {{ .Values.alloy.image | quote }}
          imagePullPolicy: IfNotPresent
          name: alloy
          ports:
            - containerPort: 3101
              name: http-metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http-metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            # Host logs and the existing host cursor directory need host-agent access.
            seLinuxOptions:
              type: spc_t
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /run/promtail
              name: run
              readOnly: true
            - mountPath: /var/lib/docker/containers
              name: containers
              readOnly: true
            - mountPath: /var/log/pods
              name: pods
              readOnly: true
            - mountPath: /etc/alloy
              name: alloy-config
              readOnly: true
            - mountPath: /run/alloy-loki
              name: alloy-state
      enableServiceLinks: true
      securityContext:
        runAsGroup: 0
        runAsUser: 0
      serviceAccountName: loki-promtail
      {{- if .Values.alloy.paused }}
      nodeSelector:
        homelab.eaglepass.io/maintenance-loki-pause: "true"
      {{- end }}
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - hostPath:
            path: /run/promtail
          name: run
        - hostPath:
            path: /var/lib/docker/containers
          name: containers
        - hostPath:
            path: /var/log/pods
          name: pods
        - configMap:
            name: loki-alloy
          name: alloy-config
        - hostPath:
            path: /run/alloy-loki
            type: DirectoryOrCreate
          name: alloy-state
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki-promtail
  namespace: {{ .Release.Namespace }}
  labels:
    helm.sh/chart: promtail-6.17.0
    app.kubernetes.io/name: promtail
    app.kubernetes.io/instance: loki
    app.kubernetes.io/version: 3.5.1
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: true
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: loki-promtail
  labels:
    helm.sh/chart: promtail-6.17.0
    app.kubernetes.io/name: promtail
    app.kubernetes.io/instance: loki
    app.kubernetes.io/version: 3.5.1
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups:
      - ''
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs:
      - get
      - watch
      - list
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: loki-promtail
  labels:
    helm.sh/chart: promtail-6.17.0
    app.kubernetes.io/name: promtail
    app.kubernetes.io/instance: loki
    app.kubernetes.io/version: 3.5.1
    app.kubernetes.io/managed-by: Helm
subjects:
  - kind: ServiceAccount
    name: loki-promtail
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: loki-promtail
  apiGroup: rbac.authorization.k8s.io
