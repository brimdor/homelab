# Preserve client DNS, headless monitoring labels and datasource identity.
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
  labels:
    app: loki
    chart: loki-2.16.0
    release: loki
    heritage: Helm
  annotations: {}
spec:
  type: ClusterIP
  ports:
    - port: 3100
      protocol: TCP
      name: http-metrics
      targetPort: http-metrics
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/component: single-binary
---
apiVersion: v1
kind: Service
metadata:
  name: loki-headless
  namespace: {{ .Release.Namespace }}
  labels:
    app: loki
    chart: loki-2.16.0
    release: loki
    heritage: Helm
    variant: headless
spec:
  clusterIP: None
  ports:
    - port: 3100
      protocol: TCP
      name: http-metrics
      targetPort: http-metrics
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/component: single-binary
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loki
  labels:
    app: loki
    chart: loki-2.16.0
    release: loki
    heritage: Helm
spec:
  selector:
    matchLabels:
      app: loki
      release: loki
      variant: headless
  namespaceSelector:
    matchNames:
      - loki
  endpoints:
    - port: http-metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-loki-stack
  namespace: {{ .Release.Namespace }}
  labels:
    app: loki-stack
    chart: loki-stack-2.10.3
    release: loki
    heritage: Helm
    grafana_datasource: '1'
data:
  loki-stack-datasource.yaml: "apiVersion: 1\ndatasources:\n- name: Loki\n  type:\
    \ loki\n  access: proxy\n  url: \"http://loki:3100\"\n  version: 1\n  isDefault:\
    \ true\n  jsonData:\n    {}"
