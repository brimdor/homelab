{{- if .Values.maintenanceRecovery.transferReceiptVerifyEnabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-buffer-continuation-receipt-20261020-30
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-store-recovery
    spec:
      restartPolicy: Never
      serviceAccountName: loki-store-recovery
      nodeSelector:
        kubernetes.io/hostname: totodile
      containers:
        - name: verify
          image: docker.io/library/python:3.13.9-alpine3.22@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command: [python3, -B, /scripts/buffer_receipt.py]
          args:
            - {{ printf "--target-uid=%s" .Values.maintenanceRecovery.transferTargetPodUID | quote }}
            - --expected-sha256=9aebc4dbd3228f62f044f191bd55e3bd0b78128bc34bc9a7c5d7b35a8631c331
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: '1'
              memory: 256Mi
          volumeMounts:
            - name: recovery
              mountPath: /recovery
              readOnly: true
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: recovery
          persistentVolumeClaim:
            claimName: loki-recovery
            readOnly: true
        - name: script
          configMap:
            name: loki-store-recovery
{{- end }}
