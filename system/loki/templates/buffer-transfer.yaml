{{- if .Values.maintenanceRecovery.transferEnabled }}
{{- if not (has .Values.maintenanceRecovery.transferPhase (list "bulk" "final" "tail" "prefix" "buffered-tail" "continuation" "buffered-continuation")) }}
{{- fail "transferPhase must be bulk, final, tail, prefix, buffered-tail, continuation or buffered-continuation" }}
{{- end }}
{{- if and (eq .Values.maintenanceRecovery.transferPhase "prefix") .Values.maintenanceRecovery.transferApply }}
{{- fail "prefix verification is read-only" }}
{{- end }}
{{- if and .Values.maintenanceRecovery.transferFrozenQueryCopy (or .Values.maintenanceRecovery.transferApply (ne .Values.maintenanceRecovery.transferPhase "continuation")) }}
{{- fail "frozen query copy requires read-only continuation audit" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-buffer-{{ .Values.maintenanceRecovery.transferPhase }}-{{ ternary "apply" "audit" .Values.maintenanceRecovery.transferApply }}-20261019-{{ .Values.maintenanceRecovery.transferAttempt }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-store-recovery
    spec:
      restartPolicy: Never
      serviceAccountName: loki-store-recovery
      {{- if .Values.maintenanceRecovery.transferFrozenQueryCopy }}
      automountServiceAccountToken: false
      initContainers:
        - name: copy-frozen-source
          image: docker.io/library/python:3.13.9-alpine3.22@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command: [python3, -B, /scripts/frozen_query_copy.py]
          args: [{{ printf "--target-uid=%s" .Values.maintenanceRecovery.transferTargetPodUID | quote }}]
          env:
            - name: LOKI_FROZEN_QUERY_COPY
              value: '1'
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_READ_SEARCH]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: frozen-source
              mountPath: /frozen-original
              readOnly: true
            - name: frozen-copy
              mountPath: /frozen-copy
            - name: recovery
              mountPath: /recovery
              readOnly: true
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        - name: frozen-query-reader
          image: docker.io/grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
          restartPolicy: Always
          args:
            - -config.file=/etc/loki/loki.yaml
            - -ingester.wal-enabled=false
            - -log.level=error
            - -querier.query-timeout=3m
            - -server.http-write-timeout=4m
            - -target=querier,compactor
            - -querier.query-store-only=true
            - -common.compactor-grpc-address=127.0.0.1:9095
          startupProbe:
            httpGet:
              path: /ready
              port: 3100
            periodSeconds: 2
            failureThreshold: 60
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          volumeMounts:
            - name: frozen-copy
              mountPath: /var/loki
              subPath: data
            - name: script
              mountPath: /etc/loki/loki.yaml
              subPath: buffer-loki.yaml
              readOnly: true
            - name: temporary
              mountPath: /tmp
      {{- end }}
      nodeSelector:
        kubernetes.io/hostname: totodile
      containers:
        - name: transfer
          image: docker.io/library/python:3.13.9-alpine3.22@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command: [python3, -B, /scripts/buffer_transfer.py]
          args:
            - {{ printf "--phase=%s" .Values.maintenanceRecovery.transferPhase | quote }}
            - {{ printf "--attempt=%v" .Values.maintenanceRecovery.transferAttempt | quote }}
            - {{ printf "--target-uid=%s" (required "transferTargetPodUID is required" .Values.maintenanceRecovery.transferTargetPodUID) | quote }}
            {{- if .Values.maintenanceRecovery.transferApply }}
            - --apply
            {{- end }}
          {{- if .Values.maintenanceRecovery.transferFrozenQueryCopy }}
          env:
            - name: LOKI_FROZEN_QUERY_COPY
              value: '1'
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          {{- end }}
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              {{- if .Values.maintenanceRecovery.transferFrozenQueryCopy }}
              add: [DAC_READ_SEARCH]
              {{- end }}
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            {{- if .Values.maintenanceRecovery.transferFrozenQueryCopy }}
            - name: frozen-source
              mountPath: /frozen-original
              readOnly: true
            - name: frozen-copy
              mountPath: /frozen-copy
              readOnly: true
            - name: api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
            - name: recovery
              mountPath: /recovery
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        {{- if .Values.maintenanceRecovery.transferFrozenQueryCopy }}
        - name: frozen-source
          persistentVolumeClaim:
            claimName: loki-cutover-buffer
            readOnly: true
        - name: frozen-copy
          emptyDir: {}
        - name: temporary
          emptyDir: {}
        - name: api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- end }}
        - name: recovery
          persistentVolumeClaim:
            claimName: loki-recovery
        - name: script
          configMap:
            name: loki-store-recovery
{{- end }}
