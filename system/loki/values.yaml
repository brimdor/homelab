server:
  nameOverride: loki
  fullnameOverride: loki-supported
  deploymentMode: Monolithic
  loki:
    auth_enabled: false
    config: |
      analytics:
        reporting_enabled: false
      auth_enabled: false
      common:
        instance_addr: 127.0.0.1
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
      chunk_store_config: {}
      compactor:
        working_directory: /var/loki/loki/boltdb-shipper-compactor
      ingester:
        chunk_block_size: 262144
        chunk_idle_period: 3m
        chunk_retain_period: 1m
        lifecycler:
          address: 127.0.0.1
          ring:
            kvstore:
              store: inmemory
            replication_factor: 1
        wal:
          dir: /var/loki/loki/wal
      limits_config:
        allow_structured_metadata: false
        discover_service_name: []
        max_entries_limit_per_query: 5000
        query_timeout: 3m
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        # Replay must preserve every original stream label.
        shard_streams:
          enabled: false
          time_sharding_enabled: false
      memberlist:
        join_members: []
      schema_config:
        configs:
          - from: '2020-10-24'
            index:
              period: 24h
              prefix: index_
            object_store: filesystem
            schema: v11
            store: boltdb-shipper
          - from: '2026-10-20'
            index:
              period: 24h
              prefix: index_
            object_store: filesystem
            schema: v13
            store: tsdb
      server:
        grpc_listen_address: 0.0.0.0
        grpc_listen_port: 9095
        http_listen_address: 0.0.0.0
        http_listen_port: 3100
        http_server_write_timeout: 4m
      storage_config:
        boltdb_shipper:
          active_index_directory: /var/loki/loki/boltdb-shipper-active
          cache_location: /var/loki/loki/boltdb-shipper-cache
          cache_ttl: 24h
        filesystem:
          directory: /var/loki/loki/chunks
        tsdb_shipper:
          active_index_directory: /var/loki/loki/tsdb-active
          cache_location: /var/loki/loki/tsdb-cache
      table_manager:
        retention_deletes_enabled: false
        retention_period: 0s
    schemaConfig:
      configs:
        - from: '2020-10-24'
          index:
            period: 24h
            prefix: index_
          object_store: filesystem
          schema: v11
          store: boltdb-shipper
        - from: '2026-10-20'
          index:
            period: 24h
            prefix: index_
          object_store: filesystem
          schema: v13
          store: tsdb
    storage:
      type: filesystem
    image:
      tag: 3.7.8
      digest: sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
  singleBinary:
    replicas: 1
    sidecar: false
    nodeSelector:
      kubernetes.io/hostname: totodile
    persistence:
      enabled: false
      dataVolumeParameters:
        persistentVolumeClaim:
          claimName: loki-data
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '2'
        memory: 1Gi
    automountServiceAccountToken: false
  serviceAccount:
    automountServiceAccountToken: false
  gateway:
    enabled: false
  ruler:
    enabled: false
  sidecar:
    rules:
      enabled: false
  test:
    enabled: false
  lokiCanary:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0
  rbac:
    namespaced: true
  memcached:
    enabled: false
    serviceAccount:
      create: false
