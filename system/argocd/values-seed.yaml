argo-cd:
  server:
    metrics: &metrics
      enabled: false
      serviceMonitor:
        enabled: false
  controller:
    metrics: *metrics
  repoServer:
    metrics: *metrics
  redis:
    metrics: *metrics
argocd-apps:
  applications:
    # Existing NFS adoption begins only after canonical Gitea-backed reconciliation.
    nfs-client-provisioner: null
  applicationsets:
    root:
      generators:
        - git:
            repoURL: &repoURL https://github.com/brimdor/homelab
            revision: &revision master
            directories:
              - path: system/*
              - path: system/nfs-client-provisioner
                exclude: true
              - path: platform/*
              - path: apps/*
      template:
        spec:
          source:
            repoURL: *repoURL
            targetRevision: *revision
