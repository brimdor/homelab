argo-cd:
  global:
    # GHSA-47m3-95c7-g2g8: restrict repository RPC to Argo peers.
    networkPolicy:
      create: true
    # Take the same-branch security fixes without changing the chart schema.
    image:
      tag: v3.4.11
    domain: argocd.eaglepass.io
  configs:
    params:
      server.insecure: true
      controller.diff.server.side: false
    cm:
      resource.ignoreResourceUpdatesEnabled: true
      resource.customizations.ignoreResourceUpdates.all: |
        jsonPointers:
          - /status
      resource.customizations.useOpenLibs.apps_StatefulSet: true
      resource.customizations.useOpenLibs.snapshot.storage.k8s.io_VolumeSnapshotClass: true
      exec.enabled: "true"
  server:
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      tls: true
    metrics: &metrics
      enabled: true
      serviceMonitor:
        enabled: true
  dex:
    enabled: false
  controller:
    metrics: *metrics
  repoServer:
    metrics: *metrics
  redis:
    exporter:
      enabled: true
      image:
        tag: v1.84.0@sha256:7ef8e9c26638158fa4e7ad60df8c7e53d1919986753d6c1d2d1876b6ec38d87b
    metrics: *metrics
argocd-apps:
  applications:
    nfs-client-provisioner:
      namespace: argocd
      project: default
      additionalAnnotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
      finalizers: []
      source:
        repoURL: http://gitea-http.gitea:3000/ops/homelab
        path: system/nfs-client-provisioner
        targetRevision: master
        helm:
          releaseName: nfs-client-provisioner
      destination:
        name: in-cluster
        namespace: kube-system
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
          - FailOnSharedResource=true
          - Prune=false
          - Delete=false
  applicationsets:
    root:
      namespace: argocd
      generators:
        - git:
            repoURL: &repoURL http://gitea-http.gitea:3000/ops/homelab
            revision: &revision master
            directories:
              - path: system/*
              - path: system/nfs-client-provisioner
                exclude: true
              - path: system/monitoring-system
                exclude: true
              - path: system/ingress-nginx
                exclude: true
              - path: platform/*
              - path: platform/external-secrets
                exclude: true
              - path: apps/*
        - git:
            repoURL: *repoURL
            revision: *revision
            directories:
              - path: system/ingress-nginx
            template:
              metadata: {}
              spec:
                project: default
                source:
                  repoURL: *repoURL
                  helm:
                    # The ingress successor uses native Ingress objects, not Traefik CRDs.
                    skipCrds: true
                destination: {}
      template:
        metadata:
          name: '{{path.basename}}'
        spec:
          destination:
            name: in-cluster
            namespace: '{{path.basename}}'
          project: default  # TODO
          source:
            repoURL: *repoURL
            path: '{{path}}'
            targetRevision: *revision
          ignoreDifferences:
            # The pinned Gitea PostgreSQL chart otherwise regenerates this on render.
            # Preserve the mounted credential; native authentication is checked separately.
            - group: ""
              kind: Secret
              name: gitea-postgresql
              namespace: gitea
              jsonPointers:
                - /data/postgres-password
            - group: external-secrets.io
              kind: ExternalSecret
              jsonPointers:
                - /spec/data/0/remoteRef/conversionStrategy
                - /spec/data/0/remoteRef/decodingStrategy
                - /spec/data/0/remoteRef/metadataPolicy
                - /spec/data/0/remoteRef/nullBytePolicy
                - /spec/data/1/remoteRef/conversionStrategy
                - /spec/data/1/remoteRef/decodingStrategy
                - /spec/data/1/remoteRef/metadataPolicy
                - /spec/data/1/remoteRef/nullBytePolicy
                - /spec/data/2/remoteRef/conversionStrategy
                - /spec/data/2/remoteRef/decodingStrategy
                - /spec/data/2/remoteRef/metadataPolicy
                - /spec/data/2/remoteRef/nullBytePolicy
                - /spec/data/3/remoteRef/conversionStrategy
                - /spec/data/3/remoteRef/decodingStrategy
                - /spec/data/3/remoteRef/metadataPolicy
                - /spec/data/3/remoteRef/nullBytePolicy
            - group: apps
              kind: StatefulSet
              jqPathExpressions:
                - .spec.persistentVolumeClaimRetentionPolicy
                - .spec.volumeClaimTemplates
                - .spec.template.spec.containers[].resources
            - group: ""
              kind: PersistentVolumeClaim
              jsonPointers:
                - /spec/storageClassName
                - /spec/volumeName
                - /spec/volumeMode
            - group: ceph.rook.io
              kind: CephCluster
              jqPathExpressions:
                - .spec.csi
                - .spec.monitoring
            - group: apiextensions.k8s.io
              kind: CustomResourceDefinition
              jqPathExpressions:
                - .spec.conversion
                - .status
                - .spec.versions[].additionalPrinterColumns[] | select(.jsonPath == ".status.refreshTime")
            - group: argoproj.io
              kind: ApplicationSet
              jqPathExpressions:
                - .spec.template.spec.syncPolicy.retry
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            syncOptions:
              - CreateNamespace=true
              - ApplyOutOfSyncOnly=true
              - ServerSideApply=true
              - RespectIgnoreDifferences=true

    root-crd-replace:
      namespace: argocd
      generators:
        - git:
            repoURL: *repoURL
            revision: *revision
            directories:
              - path: platform/external-secrets
              - path: system/monitoring-system
      template:
        metadata:
          name: '{{path.basename}}'
        spec:
          destination:
            name: in-cluster
            namespace: '{{path.basename}}'
          project: default  # TODO
          source:
            repoURL: *repoURL
            path: '{{path}}'
            targetRevision: *revision
          ignoreDifferences:
            - group: external-secrets.io
              kind: ExternalSecret
              jsonPointers:
                - /spec/data/0/remoteRef/conversionStrategy
                - /spec/data/0/remoteRef/decodingStrategy
                - /spec/data/0/remoteRef/metadataPolicy
                - /spec/data/0/remoteRef/nullBytePolicy
                - /spec/data/1/remoteRef/conversionStrategy
                - /spec/data/1/remoteRef/decodingStrategy
                - /spec/data/1/remoteRef/metadataPolicy
                - /spec/data/1/remoteRef/nullBytePolicy
                - /spec/data/2/remoteRef/conversionStrategy
                - /spec/data/2/remoteRef/decodingStrategy
                - /spec/data/2/remoteRef/metadataPolicy
                - /spec/data/2/remoteRef/nullBytePolicy
                - /spec/data/3/remoteRef/conversionStrategy
                - /spec/data/3/remoteRef/decodingStrategy
                - /spec/data/3/remoteRef/metadataPolicy
                - /spec/data/3/remoteRef/nullBytePolicy
            - group: apps
              kind: StatefulSet
              jqPathExpressions:
                - .spec.persistentVolumeClaimRetentionPolicy
                - .spec.volumeClaimTemplates
                - .spec.template.spec.containers[].resources
            - group: ""
              kind: PersistentVolumeClaim
              jsonPointers:
                - /spec/storageClassName
                - /spec/volumeName
                - /spec/volumeMode
            - group: ceph.rook.io
              kind: CephCluster
              jqPathExpressions:
                - .spec.csi
                - .spec.monitoring
            - group: apiextensions.k8s.io
              kind: CustomResourceDefinition
              jqPathExpressions:
                - .spec.conversion
                - .status
                - .spec.versions[].additionalPrinterColumns[] | select(.jsonPath == ".status.refreshTime")
            - group: argoproj.io
              kind: ApplicationSet
              jqPathExpressions:
                - .spec.template.spec.syncPolicy.retry
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            syncOptions:
              - CreateNamespace=true
              - ApplyOutOfSyncOnly=true
              - SkipHooks=true
              - ServerSideApply=true
              - Replace=true
              - RespectIgnoreDifferences=true
