# Stop the duplicate created before the ApplicationSet exclusion propagated.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-client-provisioner-nfs-subdir-external-provisioner
  namespace: nfs-client-provisioner
spec:
  replicas: 0
  selector:
    matchLabels:
      app: nfs-subdir-external-provisioner
      release: nfs-client-provisioner
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-07-30T14:27:55-05:00"
      labels:
        app: nfs-subdir-external-provisioner
        release: nfs-client-provisioner
    spec:
      serviceAccountName: nfs-client-provisioner-nfs-subdir-external-provisioner
      containers:
        - name: nfs-subdir-external-provisioner
          image: registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2
          imagePullPolicy: IfNotPresent
          securityContext: {}
          env:
            - name: PROVISIONER_NAME
              value: cluster.local/nfs-client-provisioner-nfs-subdir-external-provisioner
            - name: NFS_SERVER
              value: 10.0.40.3
            - name: NFS_PATH
              value: /mnt/user/heartlib
          volumeMounts:
            - name: nfs-subdir-external-provisioner-root
              mountPath: /persistentvolumes
      volumes:
        - name: nfs-subdir-external-provisioner-root
          nfs:
            server: 10.0.40.3
            path: /mnt/user/heartlib
