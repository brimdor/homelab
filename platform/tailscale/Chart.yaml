apiVersion: v2
name: tailscale
description: Tailscale Kubernetes Operator — exposes cluster workloads (e.g. the Wolf game streaming app) to the homelab's Tailscale tailnet (tail18136a.ts.net) via L3 Ingress proxies. Required for game streaming because Cloudflare cannot proxy UDP.
type: application
version: 0.1.0
appVersion: "1.98.9"
dependencies:
  - name: tailscale-operator
    version: "1.98.9"
    # Local copy adds only an operator replica control, which upstream 1.98.9
    # hard-codes to one. Keep the rest synchronized with the pinned release.
    repository: file://vendor/tailscale-operator
