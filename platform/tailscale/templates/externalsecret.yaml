# OnePasswordItem oauth-source.yaml creates the global-secrets source.
# ESO retains ownership of tailscale/operator-oauth and maps only this pair.
# Other 1Password fields are not propagated into the operator credential Secret.
# SecretSynced proves delivery, not provider scope/tag acceptance; keep the
# operator paused until the approved OAuth scopes and tag pass that gate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  secretStoreRef:
    name: global-secrets
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: ts-oauth-client-103
        property: client-id
    - secretKey: client_secret
      remoteRef:
        key: ts-oauth-client-103
        property: client-secret
