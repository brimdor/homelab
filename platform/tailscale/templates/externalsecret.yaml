# ExternalSecret that pulls the Tailscale OAuth client_id and client_secret
# from Kubernetes Secrets through ClusterSecretStore `global-secrets` and
# materializes them into a Secret in the `tailscale` namespace.
#
# The upstream tailscale-operator Helm chart consumes a Secret named
# `operator-oauth` (its default) with keys `client_id` and `client_secret`.
# This manifest is referenced by name in the chart, so the Secret will
# exist before the operator pod starts.
#
# The store's Kubernetes provider reads the global-secrets namespace:
#   Secret ts-oauth-client-id, key ts-oauth-client-id
#   Secret ts-oauth-client-secret, key ts-oauth-client-secret
# Neither source currently has a 1Password owner. Do not treat SecretSynced
# as evidence that the provider accepts the OAuth pair. A replacement needs
# a repository-owned secret delivery path before the operator is resumed.
#
# Create the OAuth client in the Tailscale admin console first
# (https://login.tailscale.com/admin/settings/trust-credentials) with
# write scope on General/Services, Devices/Core, and Keys/Auth Keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  secretStoreRef:
    name: global-secrets
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: ts-oauth-client-id
        property: ts-oauth-client-id
    - secretKey: client_secret
      remoteRef:
        key: ts-oauth-client-secret
        property: ts-oauth-client-secret
