# ExternalSecret that pulls the Tailscale OAuth client_id and client_secret
# from 1Password (via the existing ClusterSecretStore `global-secrets`) and
# materializes them into a Secret in the `tailscale` namespace.
#
# The upstream tailscale-operator Helm chart consumes a Secret named
# `operator-oauth` (its default) with keys `client_id` and `client_secret`.
# This manifest is referenced by name in the chart, so the Secret will
# exist before the operator pod starts.
#
# 1Password item structure (vault: `4uaua4a45yuhnwhehp5bwylmti`):
#   Item: `secrets`
#   Fields:
#     - `ts-oauth-client-id`
#     - `ts-oauth-client-secret`
#
# Create the OAuth client in the Tailscale admin console first
# (https://login.tailscale.com/admin/settings/trust-credentials) with
# write scope on General/Services, Devices/Core, and Keys/Auth Keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
  annotations:
    operator.1password.io/item-path: "vaults/4uaua4a45yuhnwhehp5bwylmti/items/secrets"
    operator.1password.io/item-name: "secrets"
spec:
  secretStoreRef:
    name: global-secrets
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: ts-oauth-client-id
    - secretKey: client_secret
      remoteRef:
        key: ts-oauth-client-secret
