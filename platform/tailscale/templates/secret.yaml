# NOTE: This template is intentionally disabled. The operator-oauth Secret
# is managed by the ExternalSecret in externalsecret.yaml, which syncs from
# the global-secrets Kubernetes ClusterSecretStore. Having both this Secret
# template and the ExternalSecret would cause ArgoCD to flag the Secret as
# OutOfSync whenever the ExternalSecret updates it.
#
# The original placeholder values are kept below as documentation of the
# expected format. To re-enable the operator:
#   1. Generate OAuth client at https://login.tailscale.com/admin/settings/trust-credentials
#   2. Store ts-oauth-client-id and ts-oauth-client-secret in global-secrets namespace
#   3. The ExternalSecret will sync them into the operator-oauth Secret automatically
{{- if false }}
apiVersion: v1
kind: Secret
metadata:
  name: operator-oauth
  namespace: tailscale
  labels:
    app.kubernetes.io/name: tailscale
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  client_id: "PLACEHOLDER_REPLACE_WITH_1PASSWORD_TS_OAUTH_CLIENT_ID"
  client_secret: "PLACEHOLDER_REPLACE_WITH_1PASSWORD_TS_OAUTH_CLIENT_SECRET"
{{- end }}
