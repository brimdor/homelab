# Secret for the Tailscale operator's OAuth client credentials.
#
# The Tailscale operator authenticates to the Tailscale control plane
# via an OAuth client (not an auth key). The official Helm chart
# expects a Secret named `operator-oauth` (the default) with two
# keys: `client_id` and `client_secret`.
#
# This Secret is created by the operator chart itself from the `oauth:`
# block in values.yaml — but we override the chart's default Secret
# creation by pre-creating this Secret here. This gives us:
#   1. The Secret is available before the operator pod starts, so
#      the operator doesn't fail with `MountVolume.SetUp failed for
#      volume "oauth"`.
#   2. The operator can be (re-)started even if the ExternalSecret
#      fails to sync (e.g. 1Password credentials not yet populated).
#
# PLACEHOLDER CREDENTIALS: the values below are intentionally
# invalid placeholders. The operator pod will start, but the
# operator's Tailscale API client will fail to authenticate. This
# is the expected state until the human provisions real OAuth
# credentials in 1Password (see the README for the runbook).
#
# Once the real credentials are in 1Password, the ExternalSecret
# in templates/externalsecret.yaml will replace this Secret with
# the real values within its 1h refresh interval.
apiVersion: v1
kind: Secret
metadata:
  name: operator-oauth
  namespace: tailscale
  labels:
    app.kubernetes.io/name: tailscale
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  client_id: "PLACEHOLDER_REPLACE_WITH_1PASSWORD_TS_OAUTH_CLIENT_ID"
  client_secret: "PLACEHOLDER_REPLACE_WITH_1PASSWORD_TS_OAUTH_CLIENT_SECRET"
