configJob:
  enabled: false
maintenance103Recovery:
  enabled: false
maintenance103PostgresMaintained:
  enabled: true
gitea:
  strategy:
    type: Recreate
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      hajimari.io/appName: Gitea
      hajimari.io/icon: git
    hosts:
      - host: git.eaglepass.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: gitea-tls-certificate
        hosts:
          - git.eaglepass.io
  gitea:
    admin:
      existingSecret: gitea-admin-secret
    config:
      server:
        LANDING_PAGE: explore
        ROOT_URL: https://git.eaglepass.io
      webhook:
        ALLOWED_HOST_LIST: private
      actions:
        ENABLED: true
  persistence:
    storageClass: standard-rwo
  postgresql:
    enabled: true
    image:
      tag: 16.15-bookworm
      registry: docker.io
      repository: library/postgres
      digest: sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
      pullPolicy: IfNotPresent
    persistence:
      storageClass: standard-rwo
    primary:
      resources:
        requests:
          cpu: 100m
          ephemeral-storage: 50Mi
          memory: 128Mi
        limits:
          cpu: 500m
          ephemeral-storage: 2Gi
          memory: 192Mi
      command:
        - /bin/bash
        - /configuration/postgres-startup.sh
      args: []
      customStartupProbe:
        exec:
          command:
            - /usr/lib/postgresql/16/bin/pg_isready
            - -h
            - 127.0.0.1
            - -p
            - '5432'
            - -U
            - gitea
            - -d
            - gitea
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 60
      customLivenessProbe:
        exec:
          command:
            - /usr/lib/postgresql/16/bin/pg_isready
            - -h
            - 127.0.0.1
            - -p
            - '5432'
            - -U
            - gitea
            - -d
            - gitea
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 12
      customReadinessProbe:
        exec:
          command:
            - /usr/lib/postgresql/16/bin/pg_isready
            - -h
            - 127.0.0.1
            - -p
            - '5432'
            - -U
            - gitea
            - -d
            - gitea
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 12
      extraVolumes:
        - name: maintained-postgresql-103
          configMap:
            name: gitea-maintained-postgresql-103
            defaultMode: 292
      extraVolumeMounts:
        - name: maintained-postgresql-103
          mountPath: /configuration/postgres-startup.sh
          subPath: postgres-startup.sh
          readOnly: true
        - name: maintained-postgresql-103
          mountPath: /configuration/postgresql.conf
          subPath: postgresql.conf
          readOnly: true
        - name: maintained-postgresql-103
          mountPath: /configuration/pg_hba.conf
          subPath: pg_hba.conf
          readOnly: true
        - name: maintained-postgresql-103
          mountPath: /usr/lib/postgresql/16/lib/pgaudit.so
          subPath: pgaudit.so
          readOnly: true
        - name: maintained-postgresql-103
          mountPath: /usr/share/postgresql/16/extension/pgaudit.control
          subPath: pgaudit.control
          readOnly: true
        - name: maintained-postgresql-103
          mountPath: /usr/share/postgresql/16/extension/pgaudit--16.1.sql
          subPath: pgaudit--16.1.sql
          readOnly: true
        - name: maintained-postgresql-103
          mountPath: /usr/share/postgresql/16/extension/pgaudit--16.0--16.1.sql
          subPath: pgaudit--16.0--16.1.sql
          readOnly: true
        - name: maintained-postgresql-103
          mountPath: /configuration/pgaudit-copyright
          subPath: pgaudit-copyright
          readOnly: true
    global:
      security:
        allowInsecureImages: true
  postgresql-ha:
    enabled: false
  valkey-cluster:
    cluster:
      nodes: 6
    valkey:
      resources:
        requests:
          cpu: 100m
          ephemeral-storage: 50Mi
          memory: 128Mi
        limits:
          cpu: 500m
          ephemeral-storage: 2Gi
          memory: 192Mi
      command:
        - valkey-server
        - /opt/bitnami/valkey/etc/valkey-default.conf
      args:
        - --bind
        - '0.0.0.0 ::'
        - --protected-mode
        - 'no'
        - --databases
        - '1'
        - --appendonly
        - 'yes'
        - --cluster-announce-ip
        - $(POD_IP)
        - --aof-load-truncated
        - 'no'
      extraEnvVars:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          partition: 1
      customStartupProbe:
        exec:
          command:
            - /bin/sh
            - -ec
            - '[ "$(valkey-cli --raw -h 127.0.0.1 PING)" = PONG ]'
        periodSeconds: 2
        timeoutSeconds: 3
        failureThreshold: 60
      customLivenessProbe:
        exec:
          command:
            - /bin/sh
            - -ec
            - '[ "$(valkey-cli --raw -h 127.0.0.1 PING)" = PONG ]'
        periodSeconds: 10
        timeoutSeconds: 3
      customReadinessProbe:
        exec:
          command:
            - /bin/sh
            - -ec
            - '[ "$(valkey-cli --raw -h 127.0.0.1 PING)" = PONG ]

              state=$(valkey-cli --raw -h 127.0.0.1 CLUSTER INFO)

              for field in cluster_state:ok cluster_slots_assigned:16384 cluster_slots_ok:16384
              cluster_slots_pfail:0 cluster_slots_fail:0 cluster_known_nodes:6; do

              case "$state" in *"$field"*) ;; *) exit 1 ;; esac

              done'
        periodSeconds: 2
        timeoutSeconds: 3
    global:
      security:
        allowInsecureImages: true
    image:
      registry: docker.io
      repository: valkey/valkey
      tag: 8.1.10
      digest: sha256:0f62bfecc0b713dc2111af3ee307d5cd53c6877b7a112c6143c4de20f1325e4c
      pullPolicy: IfNotPresent
