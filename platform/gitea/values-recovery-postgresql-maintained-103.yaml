# Dormant capture-only profile; combine with the exact maintained PostgreSQL profile.
maintenance103Recovery:
  enabled: true
gitea:
  preExtraInitContainers:
    - name: maintenance-103-init
      image: docker.gitea.com/gitea@sha256:4c4256497e2e237ddebdd30986c7ce52cb6f936b3e90c34bb9f4665714599f62
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -eu
        - /maintenance-103/gitea-init.sh
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: temp
          mountPath: /tmp
        - name: maintenance-103-startup
          mountPath: /maintenance-103
          readOnly: true
        - name: data
          mountPath: /data
          readOnly: true
  extraVolumes:
    - name: maintenance-103-startup
      configMap:
        name: gitea-maintenance-103-startup
        defaultMode: 292
  gitea:
    podAnnotations:
      maintenance103.eaglepass.io/recovery: maintained-postgresql-capture-only-v2
  postgresql:
    primary:
      nodeSelector:
        kubernetes.io/hostname: totodile
      command:
        - /bin/bash
        - -eu
        - /maintenance-103/startup.sh
      args:
        - /bin/bash
        - /configuration/postgres-startup.sh
      livenessProbe:
        enabled: false
      extraVolumes:
        - name: maintenance-103-startup
          configMap:
            name: gitea-maintenance-103-startup
            defaultMode: 292
        - name: maintained-postgresql-103
          configMap:
            name: gitea-maintained-postgresql-103
            defaultMode: 292
      extraVolumeMounts:
        - name: maintenance-103-startup
          mountPath: /maintenance-103
          readOnly: true
        - name: maintained-postgresql-103
          mountPath: /configuration/postgres-startup.sh
          subPath: postgres-startup.sh
          readOnly: true
        - name: maintained-postgresql-103
          mountPath: /configuration/postgresql.conf
          subPath: postgresql.conf
          readOnly: true
        - name: maintained-postgresql-103
          mountPath: /configuration/pg_hba.conf
          subPath: pg_hba.conf
          readOnly: true
        - name: maintained-postgresql-103
          mountPath: /usr/lib/postgresql/16/lib/pgaudit.so
          subPath: pgaudit.so
          readOnly: true
        - name: maintained-postgresql-103
          mountPath: /usr/share/postgresql/16/extension/pgaudit.control
          subPath: pgaudit.control
          readOnly: true
        - name: maintained-postgresql-103
          mountPath: /usr/share/postgresql/16/extension/pgaudit--16.1.sql
          subPath: pgaudit--16.1.sql
          readOnly: true
        - name: maintained-postgresql-103
          mountPath: /usr/share/postgresql/16/extension/pgaudit--16.0--16.1.sql
          subPath: pgaudit--16.0--16.1.sql
          readOnly: true
        - name: maintained-postgresql-103
          mountPath: /configuration/pgaudit-copyright
          subPath: pgaudit-copyright
          readOnly: true
      customStartupProbe: null
      customLivenessProbe: null
      startupProbe:
        enabled: false
