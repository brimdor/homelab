zot:
  # Issue 103: cold capture precedes the authorized v2.1.22 process replacement.
  replicaCount: 0
  ingress:
    enabled: false
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
    className: nginx
    hosts:
      - host: &host registry.eaglepass.io
        paths:
          - path: /
    tls:
      - secretName: zot-tls-certificate
        hosts:
          - *host
  podLabels:
    app: zot
  service:
    selector:
      app: zot
      app.kubernetes.io/name: zot
      app.kubernetes.io/instance: zot
  # Preserve authentication in the separate proxy and policy during the authorized upgrade.
  mountConfig: true
  configFiles:
    config.json: |-
      {
        "storage": {
          "rootDirectory": "/var/lib/registry",
          "dedupe": false,
          "gc": false
        },
        "http": {
          "address": "0.0.0.0",
          "port": "5000"
        },
        "log": {
          "level": "debug"
        }
      }
  persistence: true
  pvc:
    create: false
    name: zot-nfs-pvc
    storage: 50Gi

upgradeRecovery:
  retain: true
  run: true

authProxy:
  image: docker.io/library/nginx@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
  policyQualification: false
  backendIsolation: true
  publicIngress: true
