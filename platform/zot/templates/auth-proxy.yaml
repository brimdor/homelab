apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-auth-config
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
{{ .Files.Get "files/registry-auth.conf" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot-auth
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zot-auth
      app.kubernetes.io/instance: zot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zot-auth
        app.kubernetes.io/instance: zot
      annotations:
        checksum/config: {{ .Files.Get "files/registry-auth.conf" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: zot-auth
                topologyKey: kubernetes.io/hostname
      containers:
        - name: proxy
          image: {{ .Values.authProxy.image | quote }}
          command: ["nginx", "-c", "/etc/nginx-auth/nginx.conf"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/nginx-auth
              readOnly: true
            - name: users
              mountPath: /etc/nginx-auth-users
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: zot-auth-config
        - name: users
          secret:
            secretName: registry-auth-proxy-secret
            defaultMode: 0440
            items:
              - key: auth
                path: auth
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: zot-auth
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5000
      targetPort: http
  selector:
    app.kubernetes.io/name: zot-auth
    app.kubernetes.io/instance: zot
