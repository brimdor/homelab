apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-auth-proxy-secret
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  target:
    template:
      engineVersion: v2
      data:
        auth: '{{`{{ htpasswd "admin" .password "bcrypt" }}`}}'
  data:
    - secretKey: password
      remoteRef:
        key: registry.admin
        property: password
