worker_processes 1;
daemon off;
master_process off;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map "$request_method:$uri" $registry_realm {
        default "Registry";
        ~^(GET|HEAD):/v2/?$ off;
        ~^(GET|HEAD):/v2/.+/(manifests|blobs|referrers)/[^/]+$ off;
        ~^(GET|HEAD):/v2/.+/tags/list$ off;
    }
    server {
        listen 8080;
        client_max_body_size 0;
        client_body_timeout 900s;
        location = /healthz { return 200; }
        location / {
            auth_basic $registry_realm;
            auth_basic_user_file /etc/nginx-auth-users/auth;
            proxy_pass http://zot.zot.svc.cluster.local:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
            proxy_redirect off;
        }
    }
}
