apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-grpc-secret
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  data:
    - secretKey: WOODPECKER_GRPC_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: woodpecker.grpc
        property: secret
