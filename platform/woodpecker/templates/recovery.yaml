{{- if .Values.maintenanceRecovery.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: woodpecker-recovery
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: woodpecker-sqlite-recovery
data:
  sqlite-recovery.py: |
{{ .Files.Get "scripts/sqlite-recovery.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: woodpecker-recovery-20261019
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      # RWO may be read by another Pod only on the current writer's node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  statefulset.kubernetes.io/pod-name: woodpecker-server-0
              topologyKey: kubernetes.io/hostname
      containers:
        - name: recovery
          image: docker.io/library/python:3.13.9-alpine3.22@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command: [python3, -B, /scripts/sqlite-recovery.py]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [DAC_READ_SEARCH]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: recovery
              mountPath: /recovery
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: data-woodpecker-server-0
            readOnly: true
        - name: recovery
          persistentVolumeClaim:
            claimName: woodpecker-recovery
        - name: script
          configMap:
            name: woodpecker-sqlite-recovery
        - name: temporary
          emptyDir: {}
{{- end }}
