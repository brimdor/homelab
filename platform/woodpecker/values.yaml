woodpecker:
  agent:
    replicaCount: 1
    env:
      WOODPECKER_BACKEND_K8S_STORAGE_RWX: false
      # Agents will spawn pods to run workflow steps using the
      # Kubernetes backend instead of running them directly on
      # the agent pod, so we can run many workflows per agent.
      WOODPECKER_MAX_WORKFLOWS: 10
    extraSecretNamesForEnvFrom:
      - woodpecker-secret
  server:
    extraSecretNamesForEnvFrom:
      - woodpecker-secret
    env:
      WOODPECKER_HOST: https://ci.eaglepass.io
      WOODPECKER_WEBHOOK_HOST: http://woodpecker-server.woodpecker
      WOODPECKER_GITEA: "true"
      WOODPECKER_GITEA_URL: https://git.eaglepass.io
      WOODPECKER_OPEN: "true"
      WOODPECKER_ADMIN: gitea_admin
      # SQLite permits only one writer. Woodpecker's default pool allows 100
      # connections, which caused intermittent database-lock health failures.
      WOODPECKER_DATABASE_MAX_CONNECTIONS: "1"
      WOODPECKER_DATABASE_IDLE_CONNECTIONS: "1"
    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      ingressClassName: nginx
      hosts:
        - host: &host ci.eaglepass.io
          paths:
            - path: /
      tls:
        - secretName: woodpecker-tls-certificate
          hosts:
            - *host
