grafana:
  # Use a generated, persistent credential instead of the chart's random
  # render-time password, which otherwise changes the pod template on every
  # Argo CD repository revision and causes an unnecessary rollout.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - &host grafana.eaglepass.io
    tls:
      - secretName: grafana-general-tls
        hosts:
          - *host
  sidecar:
    image:
      tag: 2.14.1
      sha: 092dbe0c335fba9af414a27630ca68f34df6185784fa847d9954187e69dbfdd7
    dashboards:
      enabled: true
      searchNamespace: monitoring-system
      # Both k8s-sidecars share the pod network namespace. Give each health
      # server a distinct port so the datasource sidecar does not fail to bind.
      env:
        HEALTH_PORT: "8084"
    datasources:
      enabled: true
      searchNamespace: monitoring-system
      env:
        HEALTH_PORT: "8082"
  envFromSecret: grafana-secrets
  readinessProbe:
    initialDelaySeconds: 15
  grafana.ini:
    database:
      # Startup provisioning and service-account migration can contend on SQLite.
      query_retries: 10
      transaction_retries: 20
    log:
      # Record execution of one-time startup locks without logging SQL or secrets.
      filters: infra.lockservice:debug
    server:
      root_url: https://grafana.eaglepass.io
    auth.generic_oauth:
      enabled: true
      allow_sign_up: true
      name: Dex
      client_id: grafana-sso
      client_secret: $__env{GRAFANA_SSO_CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://dex.eaglepass.io/auth
      token_url: https://dex.eaglepass.io/token
      api_url: https://dex.eaglepass.io/userinfo
