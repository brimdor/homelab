apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secrets
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  target:
    name: grafana-secrets
    template:
      engineVersion: v2
      data:
        GRAFANA_SSO_CLIENT_SECRET: {{` "{{ .ssoClientSecret }}" `}}
        admin-user: admin
        admin-password: {{` "{{ .adminPassword }}" `}}
  data:
    - secretKey: ssoClientSecret
      remoteRef:
        key: dex.grafana
        property: client_secret
    - secretKey: adminPassword
      remoteRef:
        key: grafana.admin
        property: password
