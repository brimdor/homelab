apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    # Replace the CRD atomically so removed or renamed data entries do not
    # survive server-side apply's list merging.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  target:
    name: grafana-secrets
    template:
      engineVersion: v2
      data:
        GRAFANA_SSO_CLIENT_SECRET: {{` "{{ .GRAFANA_SSO_CLIENT_SECRET }}" `}}
        admin-user: admin
        admin-password: {{` "{{ .adminPassword }}" `}}
  data:
    - secretKey: GRAFANA_SSO_CLIENT_SECRET
      remoteRef:
        key: dex.grafana
        property: client_secret
    - secretKey: adminPassword
      remoteRef:
        key: grafana.admin
        property: password
