apiVersion: batch/v1
kind: Job
metadata:
  name: tsurreal-initial-director
  namespace: tsurreal-canary
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tsurreal-initial-director
        app.kubernetes.io/instance: tsurreal-initial-director
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: prepare
        image: docker.io/library/python:3.13.18-alpine3.24@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -B
        - -c
        - 'import os,sqlite3

          connection=sqlite3.connect(''file:/var/lib/tsurreal/state/hq.sqlite?mode=ro'',uri=True)

          assert connection.execute(''SELECT count(*) FROM accounts'').fetchone()[0]==0,''An
          account already exists; initial setup refused''

          rows=connection.execute(''SELECT hq_name FROM installations'').fetchall()

          assert not rows or rows==[(''Canary HQ'',)],''Existing HQ name requires
          explicit preservation''

          connection.close()

          os.mkdir(''/handoff/private'',0o700)

          print(''Initial account precondition verified; private handoff prepared'',flush=True)

          '
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: state
          mountPath: /var/lib/tsurreal
          readOnly: true
        - &id001
          name: handoff
          mountPath: /handoff
      - name: mint
        image: 10.0.20.11:32309/tsurreal/hq@sha256:78665c7a9d65e9708d442849ed9adaa45cbdb82b7fb07810e2c1107275a7e157
        imagePullPolicy: IfNotPresent
        command:
        - /opt/tsurreal/package/hq
        - --config
        - /etc/tsurreal/hq.json
        - --hq-name
        - Canary HQ
        - --setup-secret-file
        - /handoff/private/setup.json
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: state
          mountPath: /var/lib/tsurreal
        - *id001
        - name: configuration
          mountPath: /etc/tsurreal
          readOnly: true
      containers:
      - name: handoff
        image: docker.io/library/python:3.13.18-alpine3.24@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -B
        - -c
        - "from pathlib import Path\nimport time\nwhile not Path('/handoff/private/delivered').exists():\n\
          \    time.sleep(1)\nassert not Path('/handoff/private/setup.json').exists()\n\
          print('Private handoff removed; operator Job completed',flush=True)\n"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - *id001
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: tsurreal-state
      - name: configuration
        configMap:
          name: tsurreal-configuration
      - name: handoff
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
