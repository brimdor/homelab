apiVersion: batch/v1
kind: Job
metadata:
  name: tsurreal-initial-director-3
  namespace: tsurreal-canary
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tsurreal-initial-director
        app.kubernetes.io/instance: tsurreal-initial-director
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: prepare
        image: docker.io/library/python:3.13.18-alpine3.24@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -B
        - -c
        - "import os,sqlite3\nimport stat,json\nfrom pathlib import Path\nroot=Path('/var/lib/tsurreal/state')\n\
          paths=[root,*root.rglob('*')]\n# Restore this application's private custody\
          \ after the operator Pod's default fsGroup recursion.\nfor path in paths:\n\
          \    info=path.lstat()\n    assert info.st_uid==65532 and not path.is_symlink()\
          \ and (stat.S_ISDIR(info.st_mode) or stat.S_ISREG(info.st_mode))\n    assert\
          \ stat.S_ISDIR(info.st_mode) or info.st_nlink==1\nprint(json.dumps({'private_custody_before':[{'path':str(path.relative_to(root)),'mode':oct(stat.S_IMODE(path.lstat().st_mode))}\
          \ for path in paths]}),flush=True)\nfor path in paths:\n    os.chmod(path,0o700\
          \ if path.is_dir() else 0o600)\nconnection=sqlite3.connect('file:/var/lib/tsurreal/state/hq.sqlite?mode=ro',uri=True)\n\
          assert connection.execute('SELECT count(*) FROM accounts').fetchone()[0]==0,'An\
          \ account already exists; initial setup refused'\nrows=connection.execute('SELECT\
          \ hq_name FROM installations').fetchall()\nassert not rows or rows==[('Canary\
          \ HQ',)],'Existing HQ name requires explicit preservation'\nconnection.close()\n\
          os.mkdir('/handoff/private',0o700)\nprint('Initial account precondition\
          \ verified; private handoff prepared',flush=True)\n"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: state
          mountPath: /var/lib/tsurreal
        - &id001
          name: handoff
          mountPath: /handoff
      - name: mint
        image: 10.0.20.11:32309/tsurreal/hq@sha256:9efb22351971dceba49ada2b66d21d4a20bc9867ea1583ad9bf28158a8424a53
        imagePullPolicy: IfNotPresent
        command:
        - /opt/tsurreal/package/hq
        - --config
        - /etc/tsurreal/hq.json
        - --hq-name
        - Canary HQ
        - --setup-secret-file
        - /handoff/private/setup.json
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: state
          mountPath: /var/lib/tsurreal
        - *id001
        - name: configuration
          mountPath: /etc/tsurreal
          readOnly: true
      containers:
      - name: handoff
        image: docker.io/library/python:3.13.18-alpine3.24@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -B
        - -c
        - "from pathlib import Path\nimport time\nwhile not Path('/handoff/private/delivered').exists():\n\
          \    time.sleep(1)\nassert not Path('/handoff/private/setup.json').exists()\n\
          print('Private handoff removed; operator Job completed',flush=True)\n"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - *id001
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: tsurreal-state
      - name: configuration
        configMap:
          name: tsurreal-configuration
      - name: handoff
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
