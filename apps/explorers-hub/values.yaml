app-template:
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/brimdor/explorers
            tag: latest
            digest: sha256:cba08e0d7f140957208ae7ce8dac9d30c145446de8e1571760d7fbc723567e86
            pullPolicy: Always
          env:
            TZ: "America/Chicago"
  service:
    main:
      controller: main
      primary: true
      ports:
        http:
          port: 80
          protocol: HTTP
  ingress:
    main:
      enabled: true
      className: nginx
      annotations:
        external-dns.alpha.kubernetes.io/target: "homelab-tunnel.eaglepass.io"
        external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: explorers.eaglepass.io
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: 80
      tls:
        - hosts:
            - explorers.eaglepass.io
          secretName: explorers-hub-tls-certificate
