maintenanceData:
  enabled: true
  holdFixtureEnabled: false
  seed:
    enabled: false
    runID: humbleai-demo-20261020
    manifestSHA256: 58e2d4bb2881c898b89b3db5373a11b76c8f597cc653ccd94eae932ce7a1e291
app-template:
  controllers:
    main:
      replicas: 1
      annotations:
        # Preserve server defaults; replacement removed a historical live Pod annotation.
        argocd.argoproj.io/sync-options: Replace=false
      strategy: Recreate
      containers:
        main:
          image:
            repository: registry.eaglepass.io/humbleai
            tag: demo
            digest: sha256:fcf08c14538753af9539a66d2c3551e07445c664970a392da4928b80cb9fe542
            pullPolicy: IfNotPresent
          env:
            TZ: America/Chicago
            GOOGLE_CLIENT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: google-client-secret
            OPENAI_ENCRYPTION_KEY:
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: openai-encryption-key
            GOOGLE_CLIENT_ID:
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: google-client-id
          probes:
            liveness:
              enabled: false
              custom: true
              spec:
                httpGet:
                  path: /
                  port: http
                initialDelaySeconds: 30
                periodSeconds: 10
            readiness:
              enabled: false
              custom: true
              spec:
                httpGet:
                  path: /
                  port: http
                initialDelaySeconds: 5
                periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              cpu: 3
              memory: 6Gi
  service:
    main:
      controller: main
      ports:
        http:
          port: 3000
          protocol: HTTP
    api:
      controller: main
      ports:
        http:
          port: 3001
          protocol: HTTP
  ingress:
    main:
      enabled: true
      className: nginx
      annotations:
        external-dns.alpha.kubernetes.io/target: "homelab-tunnel.eaglepass.io"
        external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: humbleai-demo.eaglepass.io
          paths:
            - path: /api
              pathType: Prefix
              service:
                identifier: api
                port: http
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - humbleai-demo.eaglepass.io
          secretName: humbleai-tls
  defaultPodOptions:
    nodeSelector:
      kubernetes.io/hostname: cyndaquil
    annotations:
      operator.1password.io/item-path: "vaults/4uaua4a45yuhnwhehp5bwylmti/items/qw3p77rkxgtdu6xm3pyiduurrq"
      operator.1password.io/item-name: "secrets"
  persistence:
    data:
      type: persistentVolumeClaim
      existingClaim: humbleai-demo-data
      advancedMounts:
        main:
          main:
            - path: /app/server/data
