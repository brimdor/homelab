# Wolf config — see https://games-on-whales.github.io/wolf/stable/user/configuration.html
#
# This is the v7 schema. Wolf auto-migrates from v0 (legacy)
# on first start, but only if the v0 file is well-formed.
# Writing a v7 file directly avoids the migration step.
#
# Streaming defaults (negotiated per-session with the Moonlight
# client): NVENC H.264 / HEVC, 1080p60. Audio: Opus fullband.
# Input: virtual mouse/keyboard/gamepad via inputtino.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-wolf-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: wolf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.toml: |
    # The name that will be displayed in Moonlight
    hostname = "Wolf"
    # The version of this config file
    config_version = 7
    # A list of paired clients that will be allowed to stream
    paired_clients = []

    ######################
    # Profiles: a list of different profiles, each with a list of apps
    ######################
    [[profiles]]
    id = "moonlight-profile-id"

    [[profiles.apps]]
    start_virtual_compositor = true
    title = "Wolf UI"

    [profiles.apps.runner]
    type = "docker"
    name = "Wolf-UI"
    image = "ghcr.io/games-on-whales/wolf-ui:main"
    base_create_json = '{ "HostConfig": { "IpcMode": "host", "CapAdd": ["NET_RAW", "MKNOD", "NET_ADMIN", "SYS_ADMIN", "SYS_NICE"], "Privileged": false, "DeviceCgroupRules": ["c 13:* rmw", "c 244:* rmw"] } }'
    devices = ["/var/run/wolf/wolf.sock:/var/run/wolf/wolf.sock"]
    env = [
      "GOW_REQUIRED_DEVICES=/dev/input/event* /dev/dri/* /dev/nvidia*",
      "WOLF_SOCKET_PATH=/var/run/wolf/wolf.sock",
      "WOLF_UI_AUTOUPDATE=False",
      "LOGLEVEL=INFO"
    ]
    mounts = ["/var/run/wolf/wolf.sock:/var/run/wolf/wolf.sock"]
    ports = []

    [[profiles.apps]]
    start_virtual_compositor = true
    title = "Steam"

    [profiles.apps.runner]
    type = "docker"
    name = "Steam"
    image = "ghcr.io/games-on-whales/steam:edge"
    base_create_json = '{ "HostConfig": { "IpcMode": "host", "CapAdd": ["NET_RAW", "MKNOD", "NET_ADMIN", "SYS_ADMIN", "SYS_NICE"], "Privileged": false, "DeviceCgroupRules": ["c 13:* rmw", "c 244:* rmw"] } }'
    devices = [
      "/mnt/user/games:/mnt/games:rw",
      "/etc/wolf/profile_data/main/Steam:/home/retro:rw"
    ]
    env = ["STEAM_ARGS=-silent"]
    mounts = [
      "/mnt/user/games:/mnt/games:rw",
      "/etc/wolf/profile_data/main/Steam:/home/retro:rw"
    ]
    ports = []

    [[profiles.apps]]
    start_virtual_compositor = true
    title = "Desktop"

    [profiles.apps.runner]
    type = "docker"
    name = "Desktop"
    image = "ghcr.io/games-on-whales/xfce:edge"
    base_create_json = '{ "HostConfig": { "IpcMode": "host", "CapAdd": ["NET_RAW", "MKNOD", "NET_ADMIN", "SYS_ADMIN", "SYS_NICE"], "Privileged": false, "DeviceCgroupRules": ["c 13:* rmw", "c 244:* rmw"] } }'
    devices = ["/etc/wolf/profile_data/main/Desktop:/home/retro:rw"]
    env = []
    mounts = ["/etc/wolf/profile_data/main/Desktop:/home/retro:rw"]
    ports = []
