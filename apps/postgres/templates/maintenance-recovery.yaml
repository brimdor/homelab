{{- $recovery := .Values.maintenanceRecovery | default dict }}
{{- if $recovery.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-maintenance103-fence
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
{{- if $recovery.receiver }}
{{- $verifyOnly := $recovery.verifyOnly | default false }}
{{- $checksum := required "maintenanceRecovery.archiveSha256 is required" $recovery.archiveSha256 }}
{{- if not (regexMatch "^[0-9a-f]{64}$" $checksum) }}
{{- fail "maintenanceRecovery.archiveSha256 must be an exact SHA256" }}
{{- end }}
{{- $main := index .Values "app-template" "controllers" "main" }}
{{- if or (not (hasKey $main "replicas")) (ne (int $main.replicas) 0) }}
{{- fail "PostgreSQL replicas must be zero before enabling its PVC receiver" }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-maintenance103-recovery
data:
  restore.sh: |
{{ .Files.Get "scripts/maintenance-pvc-restore.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-maintenance103-{{ ternary "verification" "recovery" $verifyOnly }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: maintenance103-{{ ternary "verification" "recovery" $verifyOnly }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: totodile
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recover
          image: docker.io/brimdor/postgres@sha256:cf396ec97def9e03769e1736e7f1224b989bb664ead28e49dc28815e5c25988e
          command:
            - /bin/bash
            - -ceu
            - |
              {{- if $verifyOnly }}
              sync -f /restore
              marker=/restore/.maintenance103-physical-restore/accepted.sha256
              test "$(cat "$marker")" = "$SOURCE_ARCHIVE_SHA256"
              line=$(sha256sum /restore/.maintenance103-physical-restore/base.tar)
              test "${line%% *}" = "$SOURCE_ARCHIVE_SHA256"
              test "$(stat -c '%d:%i' /restore/data)" = "$(stat -c '%d:%i' /var/lib/postgresql/data)"
              pg_verifybackup --exit-on-error /var/lib/postgresql/data
              identifier=$(LC_ALL=C pg_controldata /var/lib/postgresql/data | awk -F ': *' '/^Database system identifier:/ {print $2}')
              test "$identifier" = 7702033148198322214
              test ! -e /var/lib/postgresql/data/postmaster.pid
              printf '%s\n' 'Original PVC verified independently; database remains stopped.'
              {{- else }}
              marker=/restore/.maintenance103-physical-restore/accepted.sha256
              while [ ! -f "$marker" ]; do sleep 2; done
              test "$(cat "$marker")" = "$SOURCE_ARCHIVE_SHA256"
              {{- end }}
          env:
            - name: SOURCE_ARCHIVE_SHA256
              value: {{ $checksum | quote }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts:
            - name: db-data
              mountPath: /restore
              readOnly: {{ $verifyOnly }}
            - name: db-data
              mountPath: /var/lib/postgresql/data
              subPath: data
              readOnly: {{ $verifyOnly }}
            - name: script
              mountPath: /workflow
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: postgres
        - name: script
          configMap:
            name: {{ .Release.Name }}-maintenance103-recovery
            defaultMode: 0555
        - name: temporary
          emptyDir: {}
{{- end }}
{{- end }}
