maintenanceRecovery:
  enabled: false
  receiver: false
# https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
app-template:
  controllers:
    main:
      replicas: 1
      pod:
        # Exact running image is retained on this prepared receiver during maintenance.
        nodeSelector:
          kubernetes.io/hostname: totodile
      containers:
        main:
          command:
            - /bin/bash
            - -ceu
            - |
              test -s "$PGDATA/PG_VERSION"
              test "$(cat "$PGDATA/PG_VERSION")" = 17
              test -s "$PGDATA/global/pg_control"
              exec /usr/local/bin/docker-entrypoint.sh postgres
          image:
            repository: docker.io/brimdor/postgres
            tag: "17.5-bookworm"
            digest: sha256:cf396ec97def9e03769e1736e7f1224b989bb664ead28e49dc28815e5c25988e
          env:
            TZ: "America/Chicago"
            PGDATA: "/var/lib/postgresql/data"
            POSTGRES_DB:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "postgres-db"
            POSTGRES_USER:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "postgres-user"
            POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "postgres-password"
            PAPERCLIP_POSTGRES_DB:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "paperclip-postgres-db"
            PAPERCLIP_POSTGRES_USER:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "paperclip-postgres-user"
            PAPERCLIP_POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "paperclip-postgres-password"
            THREADS_POSTGRES_DB:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "threads-postgres-db"
            THREADS_POSTGRES_USER:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "threads-postgres-user"
            THREADS_POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "threads-postgres-password"
            VERSA_POSTGRES_DB:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "versa-postgres-db"
            VERSA_POSTGRES_USER:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "versa-postgres-user"
            VERSA_POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "versa-postgres-password"
            VERSA_CANARY_POSTGRES_DB:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "versa-canary-postgres-db"
            VERSA_CANARY_POSTGRES_USER:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "versa-canary-postgres-user"
            VERSA_CANARY_POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "versa-canary-postgres-password"
        db-backup:
          image:
            repository: postgres
            tag: "18.4-bookworm"
          env:
            TZ: "America/Chicago"
            MAX_BACKUPS: "15"
            PGHOST: "127.0.0.1"
            PGPORT: "5432"
            PGDATABASE:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "postgres-db"
            PGUSER:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "postgres-user"
            PGPASSWORD:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "postgres-password"
            PAPERCLIP_POSTGRES_DB:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "paperclip-postgres-db"
            VERSA_POSTGRES_DB:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "versa-postgres-db"
            VERSA_CANARY_POSTGRES_DB:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "versa-canary-postgres-db"
          dependsOn:
            - main
          command:
            - /bin/sh
            - -c
            - |
              echo "[backup] NAS backup paused by maintenance-103"
              exec sleep infinity
        db-bootstrap:
          image:
            repository: postgres
            tag: "18.4-bookworm"
          env:
            TZ: "America/Chicago"
            PGHOST: "127.0.0.1"
            PGPORT: "5432"
            PGDATABASE:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "postgres-db"
            PGUSER:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "postgres-user"
            PGPASSWORD:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "postgres-password"
            PAPERCLIP_POSTGRES_DB:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "paperclip-postgres-db"
            PAPERCLIP_POSTGRES_USER:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "paperclip-postgres-user"
            PAPERCLIP_POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "paperclip-postgres-password"
            THREADS_POSTGRES_DB:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "threads-postgres-db"
            THREADS_POSTGRES_USER:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "threads-postgres-user"
            THREADS_POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "threads-postgres-password"
            VERSA_POSTGRES_DB:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "versa-postgres-db"
            VERSA_POSTGRES_USER:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "versa-postgres-user"
            VERSA_POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "versa-postgres-password"
            VERSA_CANARY_POSTGRES_DB:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "versa-canary-postgres-db"
            VERSA_CANARY_POSTGRES_USER:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "versa-canary-postgres-user"
            VERSA_CANARY_POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "versa-canary-postgres-password"
          dependsOn:
            - main
          command:
            - /bin/sh
            - -c
            - |
              set -e

              while true; do
                echo "[$(date +%Y-%m-%d_%H-%M-%S)] Waiting for postgres bootstrap target..."
                until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" >/dev/null 2>&1; do
                  sleep 2
                done

                psql -v ON_ERROR_STOP=1 -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" \
                  -v app_db="$PAPERCLIP_POSTGRES_DB" \
                  -v app_user="$PAPERCLIP_POSTGRES_USER" \
                  -v app_password="$PAPERCLIP_POSTGRES_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec
              SELECT format('ALTER ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password') \gexec
              SELECT format('CREATE DATABASE %I OWNER %I', :'app_db', :'app_user')
              WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'app_db') \gexec
              SELECT format('ALTER DATABASE %I OWNER TO %I', :'app_db', :'app_user') \gexec
              SELECT format('GRANT ALL PRIVILEGES ON DATABASE %I TO %I', :'app_db', :'app_user') \gexec
              SQL

                echo "[$(date +%Y-%m-%d_%H-%M-%S)] Paperclip bootstrap reconciliation complete."

                psql -v ON_ERROR_STOP=1 -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" \
                  -v app_db="$THREADS_POSTGRES_DB" \
                  -v app_user="$THREADS_POSTGRES_USER" \
                  -v app_password="$THREADS_POSTGRES_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec
              SELECT format('ALTER ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password') \gexec
              SELECT format('CREATE DATABASE %I OWNER %I', :'app_db', :'app_user')
              WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'app_db') \gexec
              SELECT format('ALTER DATABASE %I OWNER TO %I', :'app_db', :'app_user') \gexec
              SELECT format('GRANT ALL PRIVILEGES ON DATABASE %I TO %I', :'app_db', :'app_user') \gexec
              SQL

                echo "[$(date +%Y-%m-%d_%H-%M-%S)] Threads bootstrap reconciliation complete."

                psql -v ON_ERROR_STOP=1 -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" \
                  -v app_db="$VERSA_POSTGRES_DB" \
                  -v app_user="$VERSA_POSTGRES_USER" \
                  -v app_password="$VERSA_POSTGRES_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec
              SELECT format('ALTER ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password') \gexec
              SELECT format('CREATE DATABASE %I OWNER %I', :'app_db', :'app_user')
              WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'app_db') \gexec
              SELECT format('ALTER DATABASE %I OWNER TO %I', :'app_db', :'app_user') \gexec
              SELECT format('GRANT ALL PRIVILEGES ON DATABASE %I TO %I', :'app_db', :'app_user') \gexec
              SQL

                echo "[$(date +%Y-%m-%d_%H-%M-%S)] Versa bootstrap reconciliation complete."

                psql -v ON_ERROR_STOP=1 -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" \
                  -v app_db="$VERSA_CANARY_POSTGRES_DB" \
                  -v app_user="$VERSA_CANARY_POSTGRES_USER" \
                  -v app_password="$VERSA_CANARY_POSTGRES_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec
              SELECT format('ALTER ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password') \gexec
              SELECT format('CREATE DATABASE %I OWNER %I', :'app_db', :'app_user')
              WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'app_db') \gexec
              SELECT format('ALTER DATABASE %I OWNER TO %I', :'app_db', :'app_user') \gexec
              SELECT format('GRANT ALL PRIVILEGES ON DATABASE %I TO %I', :'app_db', :'app_user') \gexec
              SQL

                echo "[$(date +%Y-%m-%d_%H-%M-%S)] Versa canary bootstrap reconciliation complete."
                sleep 3600
              done
      initContainers:
        db-restore:
          image:
            repository: alpine
            tag: latest
            digest: sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          command:
            - /bin/sh
            - -c
            - |
              set -e
              test -s /persistent-data/PG_VERSION
              test "$(cat /persistent-data/PG_VERSION)" = 17
              test -s /persistent-data/global/pg_control
              echo "[INIT] Existing PostgreSQL 17 data required; automatic dump restore is disabled."
  service:
    main:
      controller: main
      ports:
        http:
          port: 5432
          protocol: TCP
  persistence:
    db-data:
      accessMode: ReadWriteOnce
      size: 20Gi
      advancedMounts:
        main:
          main:
            - path: /var/lib/postgresql/data
              subPath: data
          db-restore:
            - path: /persistent-data
              subPath: data
              readOnly: true
          db-backup:
            - path: /var/lib/postgresql
    db-init:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /docker-entrypoint-initdb.d
          db-restore:
            - path: /work
    nfs-backups:
      type: nfs
      server: 10.0.40.3
      path: /mnt/user/postgres_backups
      advancedMounts:
        main:
          db-backup:
            - path: /mnt/backup
              readOnly: true
          db-restore:
            - path: /mnt/backup
              readOnly: true
  defaultPodOptions:
    securityContext:
      fsGroup: 1000
    annotations:
      operator.1password.io/item-path: "vaults/4uaua4a45yuhnwhehp5bwylmti/items/c5krkheantm42ss5tgpg5gsxeq"
      operator.1password.io/item-name: "secrets"
