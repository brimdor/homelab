app-template:
  controllers:
    main:
      strategy: Recreate
      containers:
        database:
          args:
            - --ignore-db-dirs=lost+found
          image:
            repository: docker.io/library/mariadb
            tag: "13.0.2@sha256:0e4bb0f339feba125d1154fbacd36c16ec8518f52e44e1f82ecec7d6771caf39"
            pullPolicy: Always
          env:
            MYSQL_ROOT_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: root-password
            MYSQL_DATABASE:
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: database
            MYSQL_USER:
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: db-user
            MYSQL_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: db-password
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - sh
                    - -c
                    - 'mariadb-admin ping -h localhost -uroot -p"$MYSQL_ROOT_PASSWORD"'
                initialDelaySeconds: 15
                periodSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - sh
                    - -c
                    - 'mariadb-admin ping -h localhost -uroot -p"$MYSQL_ROOT_PASSWORD"'
                initialDelaySeconds: 10
                periodSeconds: 10

        backend:
          image:
            repository: 10.0.20.11:32309/backlog_backend
            tag: "main-6f75925@sha256:525887faf1dbf05569e6ea66acd9eb889def8ca3b8c121217a45e87a2a8e4910"
            pullPolicy: Always
          env:
            TZ: America/Chicago
            HOST_URL: https://backlog.eaglepass.io
            PORT: "3000"
            DB_HOST: localhost
            DB_PORT: "3306"
            ADMIN_MODE: "true"
            ITAD_API_KEY:
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: itad-api-key
            ITAD_SCAN_BATCH_SIZE: "200"
            DB_USER:
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: db-user
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: db-password
            DB_NAME:
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: database
            JWT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: jwt-secret
            JWT_EXPIRY: "24h"
            ENCRYPTION_KEY:
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: encryption-key
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health/live
                  port: 3000
                initialDelaySeconds: 15
                periodSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health/ready
                  port: 3000
                initialDelaySeconds: 10
                periodSeconds: 10

        frontend:
          image:
            repository: 10.0.20.11:32309/backlog_frontend
            tag: "main-6f75925-guildsdeals-on@sha256:33a018f6a571a5ea6d9e9042b705a5e931bf06b70e9b1739e61c1e1b5d70727d"
            pullPolicy: Always
          env:
            TZ: America/Chicago
            BACKEND_URL: "http://localhost:3000"
            VITE_FEATURE_ITAD_DEALS: "true"
            VITE_FEATURE_GUILDS: "true"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 80
                initialDelaySeconds: 10
                periodSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 80
                initialDelaySeconds: 5
                periodSeconds: 10

  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          protocol: HTTP
    backend:
      controller: main
      ports:
        http:
          port: 3000
          protocol: HTTP
    database:
      controller: main
      ports:
        mysql:
          port: 3306
          protocol: TCP

  ingress:
    main:
      enabled: true
      className: nginx
      annotations:
        external-dns.alpha.kubernetes.io/target: "homelab-tunnel.eaglepass.io"
        external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: backlog.eaglepass.io
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - backlog.eaglepass.io
          secretName: backlog-companion-tls

  persistence:
    data:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi
      storageClass: standard-rwo
      advancedMounts:
        main:
          database:
            - path: /var/lib/mysql

    init-schema:
      type: configMap
      name: backlog-init-schema
      advancedMounts:
        main:
          database:
            - path: /docker-entrypoint-initdb.d/init-schema.sql
              subPath: init-schema.sql
              readOnly: true

  defaultPodOptions:
    securityContext:
      fsGroup: 999
    annotations:
      operator.1password.io/item-path: "vaults/4uaua4a45yuhnwhehp5bwylmti/items/3g3cuf6gowcxdhtlteivplc27u"
      operator.1password.io/item-name: "secrets"
