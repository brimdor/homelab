app-template:
  defaultPodOptions:
    securityContext:
      fsGroup: 1001
    annotations:
      operator.1password.io/item-path: "vaults/4uaua4a45yuhnwhehp5bwylmti/items/atb6uu3xrclvwjwgxms4xeekoy"
      operator.1password.io/item-name: "secrets"

  controllers:
    outline:
      type: deployment
      annotations:
        # Replace preserves this Deployment UID and removes the legacy defaulted rollingUpdate field.
        argocd.argoproj.io/sync-options: Replace=true
      replicas: 1
      strategy: Recreate
      pod:
        annotations:
          operator.1password.io/item-path: "vaults/4uaua4a45yuhnwhehp5bwylmti/items/atb6uu3xrclvwjwgxms4xeekoy"
          operator.1password.io/item-name: "secrets"
      containers:
        main:
          securityContext:
            # Libuv falls back to epoll when the runtime denies io_uring.
            seccompProfile:
              type: RuntimeDefault
          image:
            repository: outlinewiki/outline
            tag: "1.8.0-1"
            digest: sha256:f670705964cfb5521aea45b6e78dc2eaf1fd20dec265f17bd75497938d1f3461
            pullPolicy: IfNotPresent
          env:
            NODE_ENV: production
            URL: "https://outline.eaglepass.io"
            PORT: "3000"
            SECRET_KEY:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "secret-key"
            UTILS_SECRET:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "utils-secret"
            DATABASE_URL:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "database-url"
            PGSSLMODE: disable
            REDIS_URL: "redis://outline-valkey:6379"
            FILE_STORAGE: local
            FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
            FILE_STORAGE_UPLOAD_MAX_SIZE: "262144000"
            WEB_CONCURRENCY: "1"
            FORCE_HTTPS: "true"
            DEFAULT_LANGUAGE: en_US
            OIDC_CLIENT_ID:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "oidc-client-id"
            OIDC_CLIENT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "oidc-client-secret"
            OIDC_AUTH_URI:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "oidc-auth-uri"
            OIDC_TOKEN_URI:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "oidc-token-uri"
            OIDC_USERINFO_URI:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "oidc-userinfo-uri"
            OIDC_USERNAME_CLAIM: preferred_username
            OIDC_DISPLAY_NAME: Cloudflare
            OIDC_SCOPES: "openid profile email"
            GITHUB_CLIENT_ID:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "github-client-id"
            GITHUB_CLIENT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "github-client-secret"
            GITHUB_APP_NAME:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "github-app-name"
            ENABLE_UPDATES: "false"
            DEBUG: http
            LOG_LEVEL: info
          probes:
            liveness:
              enabled: true
              type: HTTP
              path: /_health
              port: 3000
              spec:
                initialDelaySeconds: 30
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 5
            readiness:
              enabled: true
              type: HTTP
              path: /_health
              port: 3000
              spec:
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 3
            startup:
              enabled: true
              type: HTTP
              path: /_health
              port: 3000
              spec:
                initialDelaySeconds: 5
                periodSeconds: 5
                timeoutSeconds: 3
                failureThreshold: 60
    # The separately persisted Valkey owns queue writes after coordinated handoff.
    valkey:
      type: statefulset
      replicas: 1
      rollingUpdate:
        partition: "0"
      pod:
        securityContext:
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          image:
            repository: valkey/valkey
            tag: "9.1.3-alpine"
            digest: sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
            pullPolicy: IfNotPresent
          command:
            - valkey-server
          args:
            - --dir
            - /data
            - --save
            - "30"
            - "1"
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --protected-mode
            - "no"
            - --loglevel
            - warning
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                exec:
                  command: [sh, -ec, 'test "$(valkey-cli --raw -h 127.0.0.1 PING)" = PONG']
                periodSeconds: 2
                timeoutSeconds: 3
                failureThreshold: 60
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command: [sh, -ec, 'test "$(valkey-cli --raw -h 127.0.0.1 PING)" = PONG']
                periodSeconds: 5
                timeoutSeconds: 3
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command: [sh, -ec, 'test "$(valkey-cli --raw -h 127.0.0.1 PING)" = PONG']
                periodSeconds: 10
                timeoutSeconds: 3

    postgres:
      type: statefulset
      replicas: 1
      rollingUpdate:
        # Common 5.0.1 requires quoted zero to render the native rollout partition.
        partition: "0"
      pod:
        annotations:
          operator.1password.io/item-path: "vaults/4uaua4a45yuhnwhehp5bwylmti/items/atb6uu3xrclvwjwgxms4xeekoy"
          operator.1password.io/item-name: "secrets"
      containers:
        main:
          image:
            repository: postgres
            tag: "18.4-bookworm"
            digest: sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
            pullPolicy: IfNotPresent
          env:
            TZ: "America/Chicago"
            POSTGRES_USER:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "postgres-user"
            POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "postgres-password"
            POSTGRES_DB:
              valueFrom:
                secretKeyRef:
                  name: "secrets"
                  key: "postgres-db"
          probes:
            liveness:
              enabled: true
              type: TCP
              port: 5432
              spec:
                initialDelaySeconds: 10
                periodSeconds: 30
                timeoutSeconds: 5
            readiness:
              enabled: true
              type: TCP
              port: 5432
              spec:
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 3

  service:
    main:
      controller: outline
      primary: true
      ports:
        http:
          port: 3000
          protocol: HTTP
    postgres:
      controller: postgres
      ports:
        postgres:
          port: 5432
          protocol: TCP
    valkey:
      controller: valkey
      ports:
        redis:
          port: 6379
          protocol: TCP

  ingress:
    main:
      enabled: true
      className: nginx
      annotations:
        external-dns.alpha.kubernetes.io/target: "homelab-tunnel.eaglepass.io"
        external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: outline.eaglepass.io
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: 3000
      tls:
        - hosts:
            - outline.eaglepass.io
          secretName: outline-tls-certificate

  persistence:
    data:
      type: nfs
      server: 10.0.40.3
      path: /mnt/user/outline
      advancedMounts:
        outline:
          main:
            - path: /var/lib/outline/data
    valkey-data:
      type: persistentVolumeClaim
      forceRename: outline-valkey-data
      accessMode: ReadWriteOnce
      size: 1Gi
      storageClass: standard-rwo
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
      advancedMounts:
        valkey:
          main:
            - path: /data
    valkey-tmp:
      type: emptyDir
      advancedMounts:
        valkey:
          main:
            - path: /tmp
    postgres-data:
      type: persistentVolumeClaim
      # Preserve the original sole claim name when adding Valkey persistence.
      forceRename: outline
      accessMode: ReadWriteOnce
      size: 20Gi
      storageClass: standard-rwo
      advancedMounts:
        postgres:
          main:
            - path: /var/lib/postgresql
