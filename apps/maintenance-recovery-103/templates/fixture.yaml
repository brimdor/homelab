apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    maintenance103.eaglepass.io/purpose: synthetic-recovery-qualification
  annotations:
    argocd.argoproj.io/sync-options: PruneLast=true
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: startup-guards
data:
  startup.sh: |
{{ .Files.Get "files/maintenance-startup.sh" | indent 4 }}
  gitea-init.sh: |
{{ .Files.Get "files/maintenance-gitea-init.sh" | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: synthetic-postgresql
type: Opaque
stringData:
  password: synthetic-qualification-app-only
  postgres-password: synthetic-qualification-admin-only
---
apiVersion: v1
kind: Service
metadata:
  name: synthetic-postgresql
spec:
  clusterIP: None
  selector:
    app: synthetic-postgresql
  ports:
    - name: postgresql
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: synthetic-postgresql
spec:
  serviceName: synthetic-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: synthetic-postgresql
  template:
    metadata:
      labels:
        app: synthetic-postgresql
      annotations:
        maintenance103.eaglepass.io/generation: {{ .Values.generation | quote }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: pikachu
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: docker.io/bitnamilegacy/postgresql@sha256:233f361c5819c180b600d110d7da953bea6f1a00764752643ffb7b78ba85c628
          {{- if .Values.guarded }}
          command: [/bin/bash, -eu, /maintenance-103/startup.sh]
          args: [/opt/bitnami/scripts/postgresql/entrypoint.sh, /opt/bitnami/scripts/postgresql/run.sh]
          {{- else }}
          command: [/opt/bitnami/scripts/postgresql/entrypoint.sh]
          args: [/opt/bitnami/scripts/postgresql/run.sh]
          {{- end }}
          env:
            - {name: BITNAMI_DEBUG, value: "false"}
            - {name: POSTGRESQL_PORT_NUMBER, value: "5432"}
            - {name: POSTGRESQL_VOLUME_DIR, value: /bitnami/postgresql}
            - {name: PGDATA, value: /bitnami/postgresql/data}
            - {name: POSTGRES_USER, value: gitea}
            - {name: POSTGRES_DATABASE, value: gitea}
            - {name: POSTGRES_PASSWORD_FILE, value: /opt/bitnami/postgresql/secrets/password}
            - {name: POSTGRES_POSTGRES_PASSWORD_FILE, value: /opt/bitnami/postgresql/secrets/postgres-password}
            - {name: POSTGRESQL_ENABLE_LDAP, value: "no"}
            - {name: POSTGRESQL_ENABLE_TLS, value: "no"}
            - {name: POSTGRESQL_LOG_HOSTNAME, value: "false"}
            - {name: POSTGRESQL_LOG_CONNECTIONS, value: "false"}
            - {name: POSTGRESQL_LOG_DISCONNECTIONS, value: "false"}
            - {name: POSTGRESQL_PGAUDIT_LOG_CATALOG, value: "off"}
            - {name: POSTGRESQL_CLIENT_MIN_MESSAGES, value: error}
            - {name: POSTGRESQL_SHARED_PRELOAD_LIBRARIES, value: pgaudit}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            exec:
              command: [/opt/bitnami/postgresql/bin/pg_isready, -h, 127.0.0.1, -U, gitea, -d, gitea]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - {name: pgdata, mountPath: /bitnami/postgresql}
            - {name: pgtemp, mountPath: /tmp}
            - {name: pgconf, mountPath: /opt/bitnami/postgresql/conf}
            - {name: pgruntime, mountPath: /opt/bitnami/postgresql/tmp}
            - {name: synthetic-passwords, mountPath: /opt/bitnami/postgresql/secrets, readOnly: true}
            - {name: guards, mountPath: /maintenance-103, readOnly: true}
      volumes:
        - {name: pgdata, emptyDir: {}}
        - {name: pgtemp, emptyDir: {}}
        - {name: pgconf, emptyDir: {}}
        - {name: pgruntime, emptyDir: {}}
        - name: synthetic-passwords
          secret:
            secretName: synthetic-postgresql
            defaultMode: 0440
        - name: guards
          configMap:
            name: startup-guards
            defaultMode: 0444
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-gitea
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: synthetic-gitea
  template:
    metadata:
      labels:
        app: synthetic-gitea
      annotations:
        maintenance103.eaglepass.io/generation: {{ .Values.generation | quote }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: pikachu
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.guarded }}
      initContainers:
        - name: maintenance-103-init
          image: docker.gitea.com/gitea@sha256:4c4256497e2e237ddebdd30986c7ce52cb6f936b3e90c34bb9f4665714599f62
          command: [/bin/bash, -eu, /maintenance-103/gitea-init.sh]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: temp, mountPath: /tmp}
            - {name: guards, mountPath: /maintenance-103, readOnly: true}
      {{- end }}
      containers:
        - name: application-witness
          image: docker.gitea.com/gitea@sha256:4c4256497e2e237ddebdd30986c7ce52cb6f936b3e90c34bb9f4665714599f62
          command: [/bin/sh, -ceu, 'touch /tmp/initialization-completed; exec sleep 2147483647']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            exec:
              command: [/bin/test, -f, /tmp/initialization-completed]
          volumeMounts:
            - {name: temp, mountPath: /tmp}
      volumes:
        - {name: temp, emptyDir: {}}
        - name: guards
          configMap:
            name: startup-guards
            defaultMode: 0444
