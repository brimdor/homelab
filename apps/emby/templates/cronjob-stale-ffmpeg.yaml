# Kills orphaned ffmpeg subprocesses that Emby spawned but no longer owns.
#
# Background
# ----------
# On 2026-07-31 we observed libx264 fallback transcodes (PID 4698 et al.) running
# for >6 hours inside the Emby pod. Emby's internal watchdog had clearly given up
# on them: it had logged "Previous transcoding attempt failed. Falling back to
# software transcoding." multiple times before abandoning the transcode, but the
# abandoned ffmpeg process kept running and consuming CPU. New transcode requests
# then collided with the orphaned processes and returned HTTP 500.
#
# What this job does
# ------------------
# Every ${EMBY_STALE_FFMPEG_CRON_SCHEDULE} (default: every 15 minutes):
#   1. Snapshots Emby's ffmpeg subprocesses (cmdline match: /app/emby/bin/ffmpeg).
#   2. For each, parses the output dir from the trailing `.ts` arg.
#   3. If the process is older than MAX_AGE_SECONDS (default 2h) AND the
#      newest .m3u8 in its output dir is older than M3U8_STALE_SECONDS
#      (default 5 min), the process is considered stale.
#   4. SIGTERM, wait GRACE_SECONDS (default 30s), then SIGKILL if still alive.
#
# A process is NOT killed when:
#   - Its elapsed time is below MAX_AGE_SECONDS (likely a healthy long encode), OR
#   - The newest .m3u8 in its output dir was modified within M3U8_STALE_SECONDS
#     (i.e. playback is actively progressing).
#
# Why these defaults are safe
# ---------------------------
# A 4K HDR HEVC movie transcoded to 1.6 Mbps H.264 on the GTX 1650 finishes in
# ~12-16 minutes (NVENC is ~8x real-time). A 3-hour movie therefore finishes in
# well under an hour. 2 hours is a comfortable ceiling that won't kill legitimate
# transcodes. The 5-minute m3u8 staleness gate adds a second layer: even if a
# process is past 2 hours, as long as it's actively rewriting its m3u8 (i.e.
# producing segments for an active player), we leave it alone.
#
# Cleanup of the output dir is the responsibility of the existing
# emby-transcode-temp-cleanup CronJob (templates/cronjob.yaml). This job
# deliberately only kills processes; the cleanup job deletes empty session
# dirs on a 30-minute cadence.
#
# RBAC: none. The CronJob runs on the host PID namespace (hostPID: true) so it
# can kill ffmpeg PIDs directly without kubectl exec. The pod is locked to
# sprigatito via nodeSelector + toleration, so the blast radius is one node.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: emby-stale-ffmpeg-watchdog
  namespace: emby
  labels:
    app.kubernetes.io/name: emby
    app.kubernetes.io/instance: emby
    app.kubernetes.io/component: stale-ffmpeg-watchdog
spec:
  {{- with .Values.staleFfmpegWatchdog.schedule }}
  schedule: {{ . | quote }}
  {{- end }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: emby
            app.kubernetes.io/component: stale-ffmpeg-watchdog
        spec:
          restartPolicy: Never
          # Must land on sprigatito because the Emby pod (whose ffmpeg PIDs we
          # want to reach) is pinned to that node. hostPID lets us see all
          # processes on the host so we can kill the Emby-spawned ffmpegs.
          nodeSelector:
            kubernetes.io/hostname: sprigatito
          tolerations:
            - key: dedicated
              operator: Equal
              value: sprigatito
              effect: NoSchedule
          hostPID: true
          containers:
            - name: watchdog
              image: alpine:3.20
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  apk add --no-cache bash coreutils procps findutils >/dev/null
                  bash <<'WATCHDOG_EOF'
                  set -eu
                  MAX_AGE_SECONDS="${EMBY_STALE_FFMPEG_MAX_AGE_SECONDS:-7200}"
                  M3U8_STALE_SECONDS="${EMBY_STALE_FFMPEG_M3U8_STALE_SECONDS:-300}"
                  GRACE_SECONDS="${EMBY_STALE_FFMPEG_GRACE_SECONDS:-30}"
                  NOW=$(date +%s)
                  echo "[watchdog] max_age=${MAX_AGE_SECONDS}s m3u8_stale=${M3U8_STALE_SECONDS}s grace=${GRACE_SECONDS}s now=${NOW}"

                  # Locate the Emby server process. We use this to confirm the
                  # Emby pod is actually running on this host before we start
                  # killing things. If Emby is down, bail out.
                  EMBY_PID=$(ps -eo pid,cmd 2>/dev/null | awk '$2 ~ /EmbyServer$/ { print $1; exit }')
                  if [ -z "$EMBY_PID" ]; then
                    echo "[watchdog] no EmbyServer process on this host, nothing to do"
                    exit 0
                  fi
                  echo "[watchdog] emby_server_pid=$EMBY_PID"

                  # Snapshot Emby-spawned ffmpeg processes. The cmdline must
                  # contain /app/emby/bin/ffmpeg (the LSIO-shipped binary)
                  # so we never match test scripts or unrelated ffmpegs.
                  SNAP=$(mktemp)
                  trap 'rm -f "$SNAP"' EXIT
                  ps -eo pid,etimes,ppid,cmd 2>/dev/null | awk '$4 ~ /\/app\/emby\/bin\/ffmpeg/' > "$SNAP"
                  FFMPEG_COUNT=$(wc -l < "$SNAP")
                  echo "[watchdog] emby_ffmpeg_processes=$FFMPEG_COUNT"

                  KILLED=0
                  KEPT=0
                  NO_MATCH=0
                  # Note: avoid 'PPID' as a local var name; it's a bash reserved
                  # variable holding the parent PID of the current shell.
                  PARENT_PID=""
                  while IFS= read -r LINE; do
                    [ -z "$LINE" ] && continue
                    PID=$(echo "$LINE" | awk '{print $1}')
                    ELAPSED=$(echo "$LINE" | awk '{print $2}')
                    PARENT_PID=$(echo "$LINE" | awk '{print $3}')
                    CMD=$(echo "$LINE" | cut -d' ' -f4-)
                    case "$CMD" in
                      *"/app/emby/bin/ffmpeg"*) ;;
                      *) continue ;;
                    esac

                    # Extract the output session dir from the trailing `.ts`
                    # arg. Two paths are supported: the legacy /config PVC
                    # path and the current local-SSD path on sprigatito.
                    OUTDIR=$(echo "$CMD" | sed -n 's|.*\(/config/transcoding-temp/[^/]*\)/[^/]*\.ts.*|\1|p')
                    if [ -z "$OUTDIR" ]; then
                      OUTDIR=$(echo "$CMD" | sed -n 's|.*\(/emby/transcode/transcoding-temp/[^/]*\)/[^/]*\.ts.*|\1|p')
                    fi
                    if [ -z "$OUTDIR" ]; then
                      NO_MATCH=$((NO_MATCH + 1))
                      continue
                    fi

                    # Below the age threshold: leave it alone.
                    if [ "$ELAPSED" -lt "$MAX_AGE_SECONDS" ]; then
                      KEPT=$((KEPT + 1))
                      continue
                    fi

                    # Past the age threshold: check if m3u8 is being actively
                    # written (i.e. playback is progressing).
                    M3U8_STALE_REASON=""
                    if [ ! -d "$OUTDIR" ]; then
                      M3U8_STALE_REASON="no_outdir"
                    else
                      LATEST_M3U8_TS=$(find "$OUTDIR" -maxdepth 2 -name '*.m3u8' -printf '%T@\n' 2>/dev/null | sort -n | tail -1 || true)
                      if [ -z "$LATEST_M3U8_TS" ]; then
                        M3U8_STALE_REASON="no_m3u8"
                      else
                        M3U8_AGE=$(awk -v now="$NOW" -v m="$LATEST_M3U8_TS" 'BEGIN { printf "%d", now - m }')
                        if [ "$M3U8_AGE" -gt "$M3U8_STALE_SECONDS" ]; then
                          M3U8_STALE_REASON="m3u8_age=${M3U8_AGE}s"
                        fi
                      fi
                    fi

                    if [ -z "$M3U8_STALE_REASON" ]; then
                      KEPT=$((KEPT + 1))
                      continue
                    fi

                    echo "[watchdog] pid=$PID elapsed=${ELAPSED}s outdir=$OUTDIR stale($M3U8_STALE_REASON) -> SIGTERM"
                    if kill -TERM "$PID" 2>/dev/null; then
                      WAITED=0
                      while [ "$WAITED" -lt "$GRACE_SECONDS" ]; do
                        if ! kill -0 "$PID" 2>/dev/null; then
                          echo "[watchdog] pid=$PID exited after ${WAITED}s"
                          break
                        fi
                        sleep 1
                        WAITED=$((WAITED + 1))
                      done
                      if kill -0 "$PID" 2>/dev/null; then
                        echo "[watchdog] pid=$PID still alive after ${GRACE_SECONDS}s, sending SIGKILL"
                        kill -KILL "$PID" 2>/dev/null || true
                        sleep 2
                      fi
                      KILLED=$((KILLED + 1))
                    else
                      echo "[watchdog] pid=$PID kill failed (already gone)"
                    fi
                  done < "$SNAP"

                  echo "[watchdog] killed=$KILLED kept=$KEPT no_match=$NO_MATCH"
                  WATCHDOG_EOF
              env:
                - name: EMBY_STALE_FFMPEG_MAX_AGE_SECONDS
                  value: "{{ .Values.staleFfmpegWatchdog.maxAgeSeconds | default 7200 }}"
                - name: EMBY_STALE_FFMPEG_M3U8_STALE_SECONDS
                  value: "{{ .Values.staleFfmpegWatchdog.m3u8StaleSeconds | default 300 }}"
                - name: EMBY_STALE_FFMPEG_GRACE_SECONDS
                  value: "{{ .Values.staleFfmpegWatchdog.graceSeconds | default 30 }}"
              resources:
                requests:
                  cpu: 5m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
          # Security context: read-only root fs would prevent apk add, so we
          # leave the root fs writable but drop privileges after install.
          # The hostPID namespace is required for cross-process kill.
