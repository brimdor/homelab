apiVersion: v1
kind: Service
metadata:
  name: {{ include "meowdoku.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: meowdoku
  ports:
    - name: https
      port: 443
      targetPort: https
