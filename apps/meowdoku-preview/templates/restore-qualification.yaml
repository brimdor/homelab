{{- if and .Values.backup.enabled .Values.backup.restoreQualification }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-restore-%s" (include "meowdoku.name" . | trunc 34 | trimSuffix "-") .Values.backup.snapshotId | quote }}
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: meowdoku-restore-qualification
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [{{ .Values.scheduling.completedNodeHostname | quote }}]
      containers:
        - name: restore-qualification
          image: {{ .Values.backup.qualificationImage | default (printf "%s@%s" .Values.image.repository .Values.image.digest) | quote }}
          command: [node, --input-type=module, -e]
          args:
            - |
              import {backupDatabase} from './backend/src/backup.mjs';
              import {restoreDatabase} from './backend/src/restore.mjs';
              import {openDatabase,openRawDatabase} from './backend/src/sqlite.mjs';
              import {dataKey} from './backend/src/data-key.mjs';
              import {upgradeEconomy} from './backend/src/economy.mjs';
              import {validateSnapshot} from './backend/src/snapshot.mjs';
              import {createHash} from 'node:crypto';
              import {readFileSync,statSync} from 'node:fs';
              import assert from 'node:assert/strict';
              const [source,destination,expectedHash]=process.argv.slice(1);
              assert.ok(source.startsWith('/backup/')&&destination==='/restore'&&/^[a-f0-9]{64}$/.test(expectedHash),'Invalid qualification paths');
              const hash=b=>createHash('sha256').update(b).digest('hex');
              const fileHash=p=>hash(readFileSync(p));assert.equal(fileHash(source),expectedHash,'Encrypted backup identity changed');
              const canonical=v=>Array.isArray(v)?v.map(canonical):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])])):v;
              const fingerprint=v=>hash(JSON.stringify(canonical(v)));
              const rows=(db,table)=>db.prepare('SELECT * FROM '+table).all();
              const tableHash=(db,table,map=x=>x)=>fingerprint(rows(db,table).map(map).map(x=>JSON.stringify(canonical(x))).sort());
              const key=dataKey();let db;
              try{
               db=openRawDatabase(source,{key,readOnly:true});
               const schemaBefore=db.prepare('PRAGMA user_version').get().user_version;assert.ok([4,5].includes(schemaBefore));
               assert.equal(db.prepare('PRAGMA integrity_check').get().integrity_check,'ok');
               const tables=db.prepare("SELECT name FROM sqlite_schema WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name").all().map(x=>x.name);
               assert.ok(tables.every(t=>/^[A-Za-z0-9_]+$/.test(t)));
               if(schemaBefore===4)assert.equal(db.prepare("SELECT COUNT(*) n FROM entries WHERE kind='score' AND (score<0 OR score%100!=0)").get().n,0);
               const expected=Object.fromEntries(tables.map(t=>[t,tableHash(db,t,t==='entries'&&schemaBefore===4?r=>({...r,score:r.kind==='score'?r.score/100:r.score}):r=>r)]));
               const profilesBefore=rows(db,'profiles');const profileCount=profilesBefore.length;
               const scoreRows=rows(db,'entries').filter(r=>r.kind==='score').length;
               const resetTables=new Set(['sessions','nonces','recovery_tickets','runs','entries','bound_sessions','instance_challenges','request_replays','account_transfers','app_instances','run_content','profiles']);
               const retained=Object.fromEntries(tables.filter(t=>!resetTables.has(t)&&t!=='economy_state').map(t=>[t,tableHash(db,t)]));
               db.close();db=null;
               await backupDatabase(source,destination+'/migrated.sqlite',{key});
               let migrated=openDatabase(destination+'/migrated.sqlite',{key});migrated.close();
               db=openRawDatabase(destination+'/migrated.sqlite',{key,readOnly:true});
               assert.equal(db.prepare('PRAGMA user_version').get().user_version,5);assert.equal(db.prepare('SELECT version FROM economy_state WHERE id=1').get().version,2);
               for(const t of tables)assert.ok(tableHash(db,t)===expected[t],'Unexpected migration change in '+t);
               assert.equal(db.prepare('PRAGMA integrity_check').get().integrity_check,'ok');assert.equal(db.prepare('PRAGMA foreign_key_check').all().length,0);
               db.close();db=null;migrated=openDatabase(destination+'/migrated.sqlite',{key});migrated.close();
               db=openRawDatabase(destination+'/migrated.sqlite',{key,readOnly:true});
               for(const t of tables)assert.ok(tableHash(db,t)===expected[t],'Reopening changed '+t);
               db.close();db=null;
               await backupDatabase(destination+'/migrated.sqlite',destination+'/post5.sqlite.enc',{key});
               await restoreDatabase(destination+'/post5.sqlite.enc',destination+'/restored5.sqlite',{key});
               db=openRawDatabase(destination+'/restored5.sqlite',{key,readOnly:true});
               assert.equal(db.prepare('PRAGMA user_version').get().user_version,5);assert.equal(db.prepare('PRAGMA integrity_check').get().integrity_check,'ok');assert.equal(db.prepare('PRAGMA foreign_key_check').all().length,0);
               for(const [t,want]of Object.entries(retained))assert.ok(tableHash(db,t)===want,'Restored history changed in '+t);
               for(const t of resetTables)if(!['profiles','run_content'].includes(t))assert.equal(db.prepare('SELECT COUNT(*) n FROM '+t).get().n,0);
               const puzzles=JSON.parse(readFileSync('./content/puzzles.json','utf8'));
               const normalized=row=>{const {device,sharing,privacy_epoch,version,instance_jkt,snapshot,...rest}=row;let snap=snapshot?JSON.parse(snapshot):null;if(snap){snap=upgradeEconomy(snap);snap={...snap};for(const k of ['device','sharing','removalPending','pendingRuns','syncPending'])delete snap[k];if(snap.session){snap.session={...snap.session};delete snap.session.runId;delete snap.session.closesAt}}return {...rest,snapshot:snap}};
               const restored=rows(db,'profiles');assert.equal(restored.length,profileCount);
               const byId=new Map(profilesBefore.map(p=>[p.id,p]));
               for(const p of restored){const old=byId.get(p.id);assert.ok(old,'Unknown restored profile');assert.equal(p.sharing,0);assert.ok(p.device.startsWith('restored:'));assert.equal(p.privacy_epoch,old.privacy_epoch+1);assert.equal(p.version,old.version+1);assert.ok(fingerprint(normalized(p))===fingerprint(normalized(old)),'Private gameplay state changed during restore');if(p.snapshot)await validateSnapshot(upgradeEconomy(JSON.parse(p.snapshot)),Date.now(),async(_identity,id)=>{const p=puzzles.find(x=>x.id===id);assert.ok(p,'Missing canonical puzzle');return p})}
               assert.equal(fileHash(source),expectedHash,'NAS backup changed');assert.notEqual(readFileSync(destination+'/migrated.sqlite').subarray(0,16).toString('hex'),'53514c69746520666f726d6174203300');
               console.log(JSON.stringify({qualified:true,schemaBefore,schemaAfter:5,economyVersion:2,scoreRows,profiles:profileCount,scoreConversionExactlyOnce:true,challengeTimesAndOtherTablesUnchanged:true,integrity:'ok',foreignKeys:'ok',encryptedBackupRestore:true,privateGameplayBalancesAndAnimalHistoryRetained:true,authAndSharingClearedOnlyInIsolatedRestore:true,originalEncryptedNasBackupUnchanged:true,backupSha256:expectedHash,backupBytes:statSync(source).size,livePvcMounted:false}));
              }finally{db?.close();key.fill(0)}
            - {{ printf "/backup/%s.%s.sqlite.enc" .Values.backup.snapshotId .Values.dataKey.version | quote }}
            - /restore
            - "ddf0ea3ca0defefef4b7411b18545e8c70bbc78bb4df1eac47acca26554fc27e"
          env:
            - name: DATA_KEY_FILE
              value: /run/meowdoku/data-key/data-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: restore, mountPath: /restore}
            - {name: data-key, mountPath: /run/meowdoku/data-key, readOnly: true}
            - {name: backup, mountPath: /backup, readOnly: true}
      volumes:
        - name: restore
          emptyDir: {sizeLimit: 2Gi}
        - name: data-key
          secret:
            secretName: {{ .Values.dataKey.secretName | quote }}
            defaultMode: 0440
            items: [{key: data-key, path: data-key}]
        - name: backup
          nfs:
            server: {{ .Values.backup.nfs.server | quote }}
            path: {{ .Values.backup.nfs.path | quote }}
            readOnly: true
{{- end }}
