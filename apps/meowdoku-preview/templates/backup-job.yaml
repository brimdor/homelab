{{- if .Values.backup.enabled -}}
{{- $snapshot := required "backup.snapshotId requires a unique reviewed snapshot name" .Values.backup.snapshotId -}}
{{- $completedNode := required "scheduling.completedNodeHostname requires an owner-verified maintenance-complete node" .Values.scheduling.completedNodeHostname -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-backup-%s" (include "meowdoku.name" . | trunc 35 | trimSuffix "-") $snapshot | quote }}
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: meowdoku-backup
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [{{ $completedNode | quote }}]
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: {{ .Release.Name }}
                  app.kubernetes.io/name: meowdoku
      containers:
        - name: encrypted-snapshot
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - node
            - backend/src/backup.mjs
            - {{ printf "/backup/%s.%s.sqlite.enc" $snapshot .Values.dataKey.version | quote }}
          env:
            - name: DATABASE_PATH
              value: /data/meowdoku.sqlite
            - name: DATA_KEY_FILE
              value: /run/meowdoku/data-key/data-key
            - name: DATA_KEY_VERSION
              value: {{ .Values.dataKey.version | quote }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: saves
              mountPath: /data
              readOnly: true
            - name: data-key
              mountPath: /run/meowdoku/data-key
              readOnly: true
            - name: backup
              mountPath: /backup
      volumes:
        - name: saves
          persistentVolumeClaim:
            claimName: {{ .Values.storage.existingClaim | default (printf "%s-saves" (include "meowdoku.name" .)) | quote }}
            readOnly: true
        - name: data-key
          secret:
            secretName: {{ .Values.dataKey.secretName | quote }}
            defaultMode: 0440
            items:
              - key: data-key
                path: data-key
        - name: backup
          nfs:
            server: {{ .Values.backup.nfs.server | quote }}
            path: {{ .Values.backup.nfs.path | quote }}
{{- end }}
