{{- if .Values.backup.enabled -}}
{{- $snapshot := required "backup.snapshotId requires a unique reviewed snapshot name" .Values.backup.snapshotId -}}
{{- $completedNode := required "scheduling.completedNodeHostname requires an owner-verified maintenance-complete node" .Values.scheduling.completedNodeHostname -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-backup-%s" (include "meowdoku.name" . | trunc 35 | trimSuffix "-") $snapshot | quote }}
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: meowdoku-backup
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [{{ $completedNode | quote }}]
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: {{ .Release.Name }}
                  app.kubernetes.io/name: meowdoku
      containers:
        - name: encrypted-snapshot
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          stdin: true
          stdinOnce: true
          command: [node, --input-type=module, -e]
          args:
            - |
              import {createHash} from 'node:crypto';
              import {openSync,closeSync,writeFileSync,fsyncSync,statSync,statfsSync,readFileSync} from 'node:fs';
              import assert from 'node:assert/strict';
              process.umask(0o077);
              const expectedBytes=221184,expectedSha256='a321fed29bd9326b4a0383e73ca8018eeebcd12b9fa3cc57f05676acee61b3bd';
              const chunks=[];let count=0;
              for await(const chunk of process.stdin){count+=chunk.length;if(count>expectedBytes)throw Error('Ciphertext exceeds reviewed snapshot size');chunks.push(chunk)}
              assert.equal(count,expectedBytes);
              const bytes=Buffer.concat(chunks),hash=createHash('sha256').update(bytes).digest('hex');
              assert.equal(hash,expectedSha256);
              assert.notEqual(bytes.subarray(0,16).toString('hex'),'53514c69746520666f726d6174203300');
              const space=statfsSync('/backup');assert.ok(space.bavail*space.bsize>expectedBytes+1048576);
              const path={{ printf "/backup/%s.%s.sqlite.enc" $snapshot .Values.dataKey.version | toJson }};
              const fd=openSync(path,'wx',0o600);try{writeFileSync(fd,bytes);fsyncSync(fd)}finally{closeSync(fd)}
              const verify=createHash('sha256').update(readFileSync(path)).digest('hex');assert.equal(verify,expectedSha256);
              const st=statSync(path);console.log(JSON.stringify({nasBackupWritten:true,bytes:st.size,sha256:verify,mode:(st.mode&511).toString(8),uid:st.uid,gid:st.gid,nfsMount:readFileSync('/proc/mounts','utf8').split('\n').find(x=>x.includes('10.0.40.3:')&&x.includes(' /backup ')),keyProjected:false,livePvcMounted:false}));
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: backup
              mountPath: /backup
      volumes:
        - name: backup
          nfs:
            server: {{ .Values.backup.nfs.server | quote }}
            path: {{ .Values.backup.nfs.path | quote }}
{{- end }}
