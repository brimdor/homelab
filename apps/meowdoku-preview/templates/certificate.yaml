apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.tls.secretName | quote }}
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Values.tls.secretName | quote }}
  dnsNames:
    - {{ .Values.tls.hostname | quote }}
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
