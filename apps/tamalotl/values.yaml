app-template:
  global:
    alwaysAppendIdentifierToResourceName: false
  controllers:
    main:
      forceRename: tamalotl
      type: deployment
      replicas: 1
      strategy: RollingUpdate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          fsGroup: 101
          seccompProfile: {type: RuntimeDefault}
      containers:
        web:
          image:
            repository: 10.0.20.11:32309/tamalotl
            tag: canary-186b3110d86c151ef972c541d83ab319aaa05b4d
            digest: sha256:0bff6487072446e93bfc9651e56f220ce72a6ae82d8a877177e46698b2220146
            pullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet: {path: /healthz, port: http}
                periodSeconds: 20
                timeoutSeconds: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet: {path: /healthz, port: http}
                periodSeconds: 5
                timeoutSeconds: 3
            startup:
              enabled: true
              custom: true
              spec:
                httpGet: {path: /healthz, port: http}
                periodSeconds: 2
                failureThreshold: 30
  service:
    main:
      forceRename: tamalotl
      controller: main
      ports:
        http: {port: 80, protocol: HTTP, targetPort: http}
  ingress:
    main:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        external-dns.alpha.kubernetes.io/target: homelab-tunnel.eaglepass.io
        external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
      hosts:
        - host: tamalotl.eaglepass.io
          paths:
            - path: /
              pathType: Prefix
              service: {identifier: main, port: http}
      tls:
        - hosts: [tamalotl.eaglepass.io]
          secretName: tamalotl-tls
  persistence:
    temp:
      type: emptyDir
      sizeLimit: 16Mi
      globalMounts:
        - path: /tmp
  networkpolicies:
    main:
      controller: main
      policyTypes: [Ingress, Egress]
      rules:
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
            ports:
              - {protocol: TCP, port: 8080}
        egress: []
