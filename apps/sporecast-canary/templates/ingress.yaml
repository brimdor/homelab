apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sporecast
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - sporecast-canary.eaglepass.io
      secretName: sporecast-canary-tls
  rules:
    - host: sporecast-canary.eaglepass.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sporecast-frontend
                port:
                  number: 80
