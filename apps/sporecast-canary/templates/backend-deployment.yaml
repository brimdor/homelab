apiVersion: apps/v1
kind: Deployment
metadata:
  name: sporecast-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sporecast-backend
  template:
    metadata:
      labels:
        app: sporecast-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: sporecast-config
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backup
              mountPath: /backup
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8080
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8080
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sporecast-data
        - name: backup
          persistentVolumeClaim:
            claimName: sporecast-backup
