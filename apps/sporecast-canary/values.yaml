replicaCount: 1

image:
  backend:
    repository: 10.0.20.11:32309/sporecast-backend
    tag: 573da06
    pullPolicy: IfNotPresent
  frontend:
    repository: 10.0.20.11:32309/sporecast-frontend
    tag: 573da06
    pullPolicy: IfNotPresent

service:
  backend:
    type: ClusterIP
    port: 8080
  frontend:
    type: ClusterIP
    port: 80

ingress:
  enabled: true
  className: nginx
  host: sporecast-canary.eaglepass.io
  tls:
    enabled: true
    secretName: sporecast-canary-tls

persistence:
  data:
    enabled: true
    size: 1Gi
    storageClass: longhorn
  backup:
    enabled: true
    size: 10Gi
    storageClass: nfs-client

resources:
  backend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  frontend:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

env:
  DATA_DIR: /data
  BACKUP_DIR: /backup
  BACKUP_INTERVAL_HOURS: "24"
  BATCH_WINDOW_MINUTES: "5"
  OPEN_METEO_TIMEOUT_SECONDS: "10"
  ZIPPOPOTAM_BASE_URL: https://api.zippopotam.us
  OPEN_METEO_BASE_URL: https://air-quality-api.open-meteo.com/v1/air-quality
  WEBHOOK_TIMEOUT_SECONDS: "10"
  WEBHOOK_MAX_FAILURES: "5"
  ZIP_CACHE_TTL_HOURS: "168"
  INACTIVE_CLEANUP_DAYS: "90"
  LISTEN_ADDR: :8080
  LOG_LEVEL: info
  METRICS_ENABLED: "true"
  SUPPORTED_COUNTRIES: US,DE,FR,GB
