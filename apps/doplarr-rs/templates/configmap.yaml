apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Values.app.name }}-config"
  labels:
    app: "{{ .Values.app.name }}"
data:
  # doplarr_rs reads /config.toml at startup. Any "${VAR}" reference is
  # expanded against the container's environment at runtime — the same
  # vars the deployment wires up via secretKeyRef in templates/deployment.yaml.
  #
  # See: https://github.com/activexray/doplarr_rs/blob/main/MIGRATING.md
  config.toml: |
    # Generated by the apps/doplarr-rs Helm chart. Do not edit by hand —
    # changes will be reverted on the next ArgoCD sync. To modify behavior,
    # edit apps/doplarr-rs/values.yaml and commit.
    #
    # Discord bot token (resolved from 1Password via env at startup).
    discord_token = "${DISCORD_TOKEN}"

    # Logging level. String, not the `:keyword` form the Clojure version
    # used. Accepts: error, warn, info, debug, trace.
    log_level = "{{ .Values.logLevel }}"

    # When true, successful requests are announced publicly in the channel
    # (the old `:embed` behavior). When false, responses are ephemeral.
    public_followup = {{ .Values.publicFollowup }}

    # ----- Backends ---------------------------------------------------------
    # Each [[backends]] block below registers one `/request <media>` slash
    # command. The order matches `backends:` in values.yaml.
    {{- range .Values.backends }}

    [[backends]]
    media = "{{ .media }}"

    [backends.config.{{ .type }}]
    url = "{{ .url }}"
    api_key = "{{ printf "${%s}" .apiKeyEnvVar }}"
    {{- if .qualityProfile }}
    quality_profile = "{{ .qualityProfile }}"
    {{- end }}
    {{- if .rootfolder }}
    rootfolder = "{{ .rootfolder }}"
    {{- end }}
    {{- if .monitorType }}
    monitor_type = "{{ .monitorType }}"
    {{- end }}
    {{- if .minimumAvailability }}
    minimum_availability = "{{ .minimumAvailability }}"
    {{- end }}
    {{- if .seasonFolders }}
    season_folders = {{ .seasonFolders }}
    {{- end }}
    {{- if hasKey . "allowSpecials" }}
    allow_specials = {{ .allowSpecials }}
    {{- end }}
    {{- if hasKey . "allowAllSeasons" }}
    allow_all_seasons = {{ .allowAllSeasons }}
    {{- end }}
    {{- if .seriesType }}
    series_type = "{{ .seriesType }}"
    {{- end }}
    {{- end }}
