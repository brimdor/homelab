{{- with .Values.maintenanceEmptyJobs }}
{{- if .enabled }}
{{- $app := index $.Values "app-template" }}
{{- $name := "maintenance-empty-jobs-103-20261026-a" }}
{{- $script := $.Files.Get "files/maintenance-empty-jobs.mjs" }}
{{- $controller := $app.controllers.retention }}
{{- $container := $controller.containers.retention }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
data:
  run.mjs: |
{{ $.Files.Get "files/maintenance-empty-jobs.mjs" | indent 4 }}
{{- range $task := list "triage" "retention" }}
{{- $job := printf "maintenance-103-%s-20261026-b" $task }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $job }}
  ownerReferences:
    - apiVersion: batch/v1
      kind: CronJob
      name: {{ printf "%s-%s" $.Release.Name $task }}
      uid: {{ index $.Values.maintenanceEmptyJobs.ownerUIDs $task | quote }}
      controller: true
      blockOwnerDeletion: false
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $.Release.Name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        # Retention policy permits only DNS and this application's PostgreSQL; no external API egress.
        app.kubernetes.io/controller: retention
        maintenance.eaglepass.io/operation: {{ $name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: growlithe
      terminationGracePeriodSeconds: 10
      securityContext:
{{ toYaml $controller.pod.securityContext | indent 8 }}
      containers:
        - name: recovery
          image: {{ printf "%s:%s@%s" $container.image.repository $container.image.tag $container.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          command: [node, /maintenance/run.mjs]
          workingDir: /app
          env:
            - name: MAINTENANCE_TASK
              value: {{ $task | quote }}
{{- range $key, $value := $container.env }}
            - name: {{ $key }}
{{- if kindIs "map" $value }}
{{ toYaml $value | indent 14 }}
{{- else }}
              value: {{ $value | quote }}
{{- end }}
{{- end }}
          securityContext:
{{ toYaml $container.securityContext | indent 12 }}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: script, mountPath: /maintenance, readOnly: true}
            - {name: attachments, mountPath: /var/lib/pointview/attachments, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: script
          configMap: {name: {{ $name }}}
        - name: attachments
          persistentVolumeClaim: {claimName: {{ printf "%s-attachments" $.Release.Name }}}
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
{{- end }}
