apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{ .Release.Name }}-backup"
  labels:
    app.kubernetes.io/name: "{{ .Release.Name }}"
    app.kubernetes.io/component: backup
spec:
  # Run before the Monday/Wednesday/Friday 01:45-07:00 node reboot window.
  # The backup requires same-node affinity with the RWO-backed app pod, so a
  # 02:00 run can remain unschedulable while that node is drained.
  schedule: "30 0 * * *"
  timeZone: America/Chicago
  # Finished pods keep their NFS mounts until Kubernetes removes the Job.
  # Do not retain them: stale Unraid file handles otherwise leak into the
  # next backup pod through the node's shared NFS client state.
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 0
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 60
      template:
        metadata:
          labels:
            app.kubernetes.io/name: "{{ .Release.Name }}"
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          # The application data PVC is Ceph RBD (ReadWriteOnce). Keep the
          # backup pod on the application's node so the volume is never
          # multi-attached when the scheduler chooses a different worker.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/controller: main
                      app.kubernetes.io/instance: "{{ .Release.Name }}"
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: sqlite-backup
              image: alpine:3.20
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  apk add --no-cache sqlite >/dev/null
                  mkdir -p /backup
                  BACKUP_FILE="/backup/sporecast-$(date +%Y%m%d-%H%M%S).db"
                  sqlite3 /data/sporecast.db ".backup '$BACKUP_FILE'"
                  find /backup -name 'sporecast-*.db' -mtime +14 -delete
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: backup
                  mountPath: /backup
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: "{{ .Release.Name }}"
            - name: backup
              persistentVolumeClaim:
                claimName: "{{ .Release.Name }}-backup"
