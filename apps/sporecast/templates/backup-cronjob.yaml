apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{ .Release.Name }}-backup"
  labels:
    app.kubernetes.io/name: "{{ .Release.Name }}"
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: "{{ .Release.Name }}"
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sqlite-backup
              image: alpine:3.20
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  apk add --no-cache sqlite >/dev/null
                  mkdir -p /backup
                  BACKUP_FILE="/backup/sporecast-$(date +%Y%m%d-%H%M%S).db"
                  sqlite3 /data/sporecast.db ".backup '$BACKUP_FILE'"
                  find /backup -name 'sporecast-*.db' -mtime +14 -delete
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: backup
                  mountPath: /backup
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: "{{ .Release.Name }}-data"
            - name: backup
              persistentVolumeClaim:
                claimName: "{{ .Release.Name }}-backup"
