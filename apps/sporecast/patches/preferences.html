<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sporecast — Manage alert</title>
  <link rel="stylesheet" href="/styles.css">
  <script>
    if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .dark body { background-color: #0f172a; color: #e2e8f0; }

    .touch-target { min-height: 44px; }
    input, select, button { touch-target; }
  </style>
</head>
<body class="min-h-screen">
  <header class="border-b border-slate-700/30 bg-white dark:bg-slate-900/50 sticky top-0">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-xl font-bold tracking-tight">🌾 Sporecast</h1>
      <a href="/" class="text-sm text-emerald-400 hover:underline">New alert</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8">
    <div class="rounded-lg bg-amber-900/20 border border-amber-700/30 p-4 mb-6">
      <p class="text-sm text-amber-200">🔖 <strong>Bookmark this link.</strong> It is the only way to access or edit your alert.</p>
    </div>

    <form id="prefsForm" class="space-y-6 bg-white dark:bg-slate-800/50 rounded-xl p-6 border border-slate-200 dark:border-slate-700/30 shadow-sm">
      <input type="hidden" id="token" name="token">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm text-slate-400">ZIP / Postal code</p>
          <p id="zipDisplay" class="font-medium"></p>
        </div>
        <div id="capabilityPills" class="flex gap-2"></div>
      </div>

      <div>
        <label class="block text-sm font-medium mb-2">What to track</label>
        <div id="allergenGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
      </div>

      <div>
        <label class="block text-sm font-medium mb-2">When to alert</label>
        <div id="thresholdList" class="space-y-3"></div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1" for="digestTime">Digest time</label>
          <input id="digestTime" name="digest_time" type="time" required class="w-full rounded-lg border border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1" for="checkInterval">Check cadence</label>
          <select id="checkInterval" name="check_interval"
                  class="w-full rounded-lg border border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2">
            <option value="">Daily at digest time (default)</option>
            <option value="30">Every 30 minutes</option>
            <option value="60">Every hour</option>
            <option value="180">Every 3 hours</option>
            <option value="480">Every 8 hours</option>
            <option value="720">Every 12 hours</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-1 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1" for="timezone">Timezone</label>
          <input id="timezone" name="timezone" type="text" required class="w-full rounded-lg border border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2">
        </div>
      </div>

      <div class="border-t border-slate-700/30 pt-4 space-y-3">
        <p class="text-sm font-medium">Webhook destination</p>
        <div>
          <label class="block text-xs mb-1" for="webhookUrl">URL (https only)</label>
          <input id="webhookUrl" name="webhook_url" type="url" required class="w-full rounded-lg border border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2">
        </div>
        <div>
          <label class="block text-xs mb-1" for="webhookFormat">Format</label>
          <select id="webhookFormat" name="webhook_format" class="w-full rounded-lg border border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2">
            <option value="discord">Discord</option>
            <option value="generic-json">Generic JSON</option>
            <option value="generic-text">Generic text</option>
          </select>
        </div>
        <div>
          <label class="block text-xs mb-1" for="webhookLabel">Label</label>
          <input id="webhookLabel" name="webhook_label" type="text" class="w-full rounded-lg border border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2">
        </div>
      </div>

      <div id="errorBox" class="hidden rounded-lg bg-red-900/30 text-red-200 p-3 text-sm"></div>
      <div id="successBox" class="hidden whitespace-pre-wrap rounded-lg bg-emerald-900/30 text-emerald-200 p-3 text-sm"></div>

      <div class="flex flex-col sm:flex-row gap-3">
        <button type="submit" class="flex-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 touch-target">Save changes</button>
        <button type="button" id="nowBtn"
                class="flex-1 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white font-medium py-3 touch-target"
                title="Fetches current Open-Meteo data and dispatches a real digest to your webhook">
          SporeCast Now
        </button>
        <button type="button" id="deleteBtn" class="flex-1 rounded-lg bg-red-600 hover:bg-red-500 text-white font-medium py-3 touch-target">Delete alert</button>
      </div>
    </form>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
