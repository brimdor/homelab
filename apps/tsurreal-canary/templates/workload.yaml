{{- if eq .Values.stage "candidate" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tsurreal-identity-preparation
data:
  prepare-identity.py: |
{{ .Files.Get "files/prepare-identity.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsurreal-canary
  annotations:
    tsurreal.zuriel-labs.io/source-commit: {{ .Values.sourceCommit | quote }}
    tsurreal.zuriel-labs.io/source-tree: {{ .Values.sourceTree | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tsurreal
      app.kubernetes.io/instance: tsurreal-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tsurreal
        app.kubernetes.io/instance: tsurreal-canary
      annotations:
        checksum/configuration: {{ include (print $.Template.BasePath "/resources.yaml") . | sha256sum }}
        checksum/identity-preparation: {{ .Files.Get "files/prepare-identity.py" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-identity
          image: {{ .Values.identityImage }}
          command: [python3, -B, /scripts/prepare-identity.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: projected-tls, mountPath: /projected-tls, readOnly: true}
            - {name: identity, mountPath: /var/run/tsurreal}
            - {name: identity-script, mountPath: /scripts, readOnly: true}
      containers:
        - name: hq
          image: {{ .Values.image | quote }}
          args: [--config, /etc/tsurreal/hq.json]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - {name: https, containerPort: 8443}
          startupProbe:
            exec:
              command: [/opt/tsurreal/package/hq, --config, /etc/tsurreal/hq.json, --readiness-check]
            periodSeconds: 5
            timeoutSeconds: 12
            failureThreshold: 24
          readinessProbe:
            exec:
              command: [/opt/tsurreal/package/hq, --config, /etc/tsurreal/hq.json, --readiness-check]
            periodSeconds: 5
            timeoutSeconds: 12
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: configuration, mountPath: /etc/tsurreal, readOnly: true}
            - {name: identity, mountPath: /var/run/tsurreal, readOnly: true}
            - {name: state, mountPath: /var/lib/tsurreal}
            - {name: recovery, mountPath: /var/lib/tsurreal-recovery}
            - {name: packages, mountPath: /var/lib/tsurreal-packages}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: configuration
          configMap: {name: tsurreal-configuration}
        - name: identity-script
          configMap: {name: tsurreal-identity-preparation}
        - name: projected-tls
          secret:
            secretName: {{ .Values.tlsSecret }}
            defaultMode: 0440
        - name: identity
          emptyDir: {medium: Memory, sizeLimit: 4Mi}
        - name: temporary
          emptyDir: {sizeLimit: 256Mi}
        - name: state
          persistentVolumeClaim: {claimName: tsurreal-state}
        - name: recovery
          persistentVolumeClaim: {claimName: tsurreal-recovery}
        - name: packages
          persistentVolumeClaim: {claimName: tsurreal-packages}
{{- end }}
