app-template:
  global:
    nameOverride: tsurreal
    alwaysAppendIdentifierToResourceName: false
  controllers:
    main:
      enabled: true
      forceRename: tsurreal-canary
      type: deployment
      strategy: Recreate
      replicas: 1
      annotations:
        tsurreal.zuriel-labs.io/source-commit: e748af7621bfbffbd48b902c8e21f9cfa7efd195
        tsurreal.zuriel-labs.io/source-tree: 5a9cc52530e1d5031bc096dc05ce1d59ffe7a52f
      initContainers:
        prepare-identity:
          image:
            repository: 10.0.20.11:32309/tsurreal/hq
            digest: sha256:89d16e676e2f411c464d46fb07c854847b9259c632de7e21ca208eb30a871425
            pullPolicy: IfNotPresent
          command:
          - /opt/tsurreal/package/hq
          - --stage-identity-source
          - /projected-tls
          - --stage-identity-output
          - /run/tsurreal/identity
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          probes:
            startup:
              enabled: false
            readiness:
              enabled: false
            liveness:
              enabled: false
      containers:
        hq:
          image:
            repository: 10.0.20.11:32309/tsurreal/hq
            digest: sha256:89d16e676e2f411c464d46fb07c854847b9259c632de7e21ca208eb30a871425
            pullPolicy: IfNotPresent
          args:
          - --config
          - /etc/tsurreal/hq.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          ports:
          - name: https
            containerPort: 8443
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                  - /opt/tsurreal/package/hq
                  - --config
                  - /etc/tsurreal/hq.json
                  - --readiness-check
                periodSeconds: 5
                timeoutSeconds: 12
                failureThreshold: 24
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                  - /opt/tsurreal/package/hq
                  - --config
                  - /etc/tsurreal/hq.json
                  - --readiness-check
                periodSeconds: 5
                timeoutSeconds: 12
                failureThreshold: 3
            liveness:
              enabled: false
      pod:
        automountServiceAccountToken: false
        terminationGracePeriodSeconds: 25
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      serviceAccount:
        name: default
  service:
    main:
      forceRename: tsurreal-canary
      primary: true
      controller: main
      type: ClusterIP
      ports:
        https:
          port: 443
          targetPort: 8443
          protocol: TCP
  ingress:
    main:
      enabled: true
      forceRename: tsurreal-canary
      className: nginx
      annotations:
        # Preserve the end-to-end Node client certificate checked by HQ.
        nginx.ingress.kubernetes.io/ssl-passthrough: 'true'
        nginx.ingress.kubernetes.io/backend-protocol: HTTPS
        # HTTP middleware does not filter TCP passthrough; the existing firewall does.
        nginx.ingress.kubernetes.io/whitelist-source-range: 127.0.0.1/32,::1/128
      hosts:
      - host: &host tsurreal-canary.eaglepass.io
        paths:
        - path: /
          pathType: Prefix
          service:
            identifier: main
            port: 443
      tls:
      - hosts:
        - *host
        secretName: tsurreal-canary-tls
  persistence:
    data:
      type: persistentVolumeClaim
      forceRename: tsurreal-state
      accessMode: ReadWriteOnce
      size: 4Gi
      storageClass: standard-rwo
      retain: true
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
      advancedMounts:
        main:
          hq:
          - path: /var/lib/tsurreal
    recovery:
      type: persistentVolumeClaim
      forceRename: tsurreal-recovery
      accessMode: ReadWriteOnce
      size: 16Gi
      storageClass: standard-rwo
      retain: true
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
      advancedMounts:
        main:
          hq:
          - path: /var/lib/tsurreal-recovery
    packages:
      type: persistentVolumeClaim
      forceRename: tsurreal-packages
      accessMode: ReadWriteOnce
      size: 8Gi
      storageClass: standard-rwo
      retain: true
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
      advancedMounts:
        main:
          hq:
          - path: /var/lib/tsurreal-packages
    configuration:
      type: configMap
      name: tsurreal-configuration
      advancedMounts:
        main:
          hq:
          - path: /etc/tsurreal
            readOnly: true
    projected-tls:
      type: secret
      name: tsurreal-canary-tls
      defaultMode: 288
      advancedMounts:
        main:
          prepare-identity:
          - path: /projected-tls
            readOnly: true
    identity:
      type: emptyDir
      medium: Memory
      sizeLimit: 4Mi
      advancedMounts:
        main:
          prepare-identity:
          - path: /run/tsurreal
          hq:
          - path: /run/tsurreal
            readOnly: true
    temporary:
      type: emptyDir
      sizeLimit: 256Mi
      advancedMounts:
        main:
          hq:
          - path: /tmp
  configMaps:
    configuration:
      forceRename: tsurreal-configuration
      includeInChecksum: true
      data:
        hq.json: |
          {{ if ne .Release.Namespace "tsurreal-canary" }}{{ fail "This chart owns only namespace tsurreal-canary" }}{{ end }}{{ if not (regexMatch "^10\\.0\\.20\\.11:32309/tsurreal/hq$" .Values.controllers.main.containers.hq.image.repository) }}{{ fail "Tsurreal requires its selected private registry" }}{{ end }}{{ if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.controllers.main.containers.hq.image.digest) }}{{ fail "Tsurreal requires an immutable image digest" }}{{ end }}{{ $init := (index .Values.controllers.main.initContainers "prepare-identity").image }}{{ if or (ne $init.repository .Values.controllers.main.containers.hq.image.repository) (ne $init.digest .Values.controllers.main.containers.hq.image.digest) }}{{ fail "Tsurreal identity init requires the exact HQ image" }}{{ end }}{{ range $key := list "tsurreal.zuriel-labs.io/source-commit" "tsurreal.zuriel-labs.io/source-tree" }}{{ if not (regexMatch "^[a-f0-9]{40}$" (index $.Values.controllers.main.annotations $key)) }}{{ fail "Tsurreal requires exact source identities" }}{{ end }}{{ end }}{"version":1,"component":"hq","access_mode":"lan","listen":"0.0.0.0:8443","origin":"https://tsurreal-canary.eaglepass.io","state_dir":"/var/lib/tsurreal/state","tls_cert":"/run/tsurreal/identity/tls.crt","tls_key":"/run/tsurreal/identity/tls.key","tls_client_cidrs":["10.0.0.0/16","127.0.0.1/32","::1/128"]}
  networkpolicies:
    main:
      forceRename: tsurreal-private
      type: native
      podSelector: {}
      policyTypes:
      - Ingress
      - Egress
      rules:
        ingress:
        - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ingress-nginx
            podSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
                app.kubernetes.io/instance: ingress-nginx-ingress-nginx
          ports:
          - protocol: TCP
            port: 8443
        egress: []
  rawResources:
    namespace:
      forceRename: tsurreal-canary
      manifest:
        apiVersion: v1
        kind: Namespace
        metadata:
          annotations:
            argocd.argoproj.io/sync-options: Prune=false,Delete=false
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: v1.33
        spec: {}
    certificate:
      forceRename: tsurreal-canary
      manifest:
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          namespace: tsurreal-canary
        spec:
          secretName: tsurreal-canary-tls
          issuerRef:
            name: letsencrypt-prod
            kind: ClusterIssuer
          dnsNames:
          - tsurreal-canary.eaglepass.io
          privateKey:
            algorithm: ECDSA
            size: 256
            rotationPolicy: Always
    preupgrade:
      forceRename: tsurreal-v35-pre-0d9e030a
      manifest:
        apiVersion: snapshot.storage.k8s.io/v1
        kind: VolumeSnapshot
        metadata:
          namespace: tsurreal-canary
          annotations:
            helm.sh/resource-policy: keep
            argocd.argoproj.io/sync-options: Prune=false,Delete=false
            tsurreal.zuriel-labs.io/source-pvc-uid: bbd5ca78-93b1-4a0e-9062-35a79b8103ce
        spec:
          volumeSnapshotClassName: ceph-block
          source:
            persistentVolumeClaimName: tsurreal-state
  serviceAccount:
    main:
      enabled: false
