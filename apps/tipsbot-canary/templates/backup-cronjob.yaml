apiVersion: batch/v1
kind: CronJob
metadata:
  name: tipsbot-canary-backup
  namespace: tipsbot-canary
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:3.20
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache sqlite
                  mkdir -p /backup
                  timestamp=$(date +%Y%m%d-%H%M%S)
                  sqlite3 /data/tipsbot.db ".backup '/backup/tipsbot-${timestamp}.db'"
                  find /backup -name 'tipsbot-*.db' -mtime +14 -delete
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: backup
                  mountPath: /backup
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: tipsbot-canary-data
            - name: backup
              persistentVolumeClaim:
                claimName: tipsbot-canary-backup
