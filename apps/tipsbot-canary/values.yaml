app-template:
  controllers:
    main:
      type: deployment
      replicas: 1
      pod:
        securityContext:
          fsGroup: 65532
          fsGroupChangePolicy: OnRootMismatch
        annotations:
          operator.1password.io/item-path: "vaults/4uaua4a45yuhnwhehp5bwylmti/items/pgafelsw5c2p4oj7czfmt2do3q"
          operator.1password.io/item-name: "secrets"
      containers:
        main:
          image:
            repository: 10.0.20.11:32309/brimdor/tipsbot
            tag: v0.3.0-rc.1
            pullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            DATA_DIR: /data
            LISTEN_ADDR: ":8080"
            LOG_LEVEL: info
            CHAT_SESSION_INACTIVITY_DAYS: "90"
            PUBLIC_BASE_URL: https://tipsbot-canary.eaglepass.io
            SECRETS_ENCRYPTION_KEY:
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: secrets-encryption-key
            ADMIN_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: admin-username
            ADMIN_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: admin-password
            TIPS_CF_ACCESS: "false"
            # Canary domain (tipsbot-canary.eaglepass.io) has no real Cloudflare Access at the edge.
            # Do not trust Cf-Access-User-Email here; rely on X-Admin-Email (from SPA build) instead.
            # If canary is later moved behind real Cloudflare Access, flip this to "true".
            TIPS_TRUST_CF_HEADERS: "false"
          probes:
            liveness:
              type: HTTP
              path: /api/health/live
              port: http
            readiness:
              type: HTTP
              path: /api/health/ready
              port: http
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
  service:
    main:
      controller: main
      primary: true
      ports: { http: { port: 80, targetPort: http } }
  ingress:
    main:
      enabled: true
      className: nginx
      annotations:
        external-dns.alpha.kubernetes.io/target: homelab-tunnel.eaglepass.io
        external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: tipsbot-canary.eaglepass.io
          paths:
            - path: /
              pathType: Prefix
              service: { identifier: main, port: http }
      tls:
        - hosts: [tipsbot-canary.eaglepass.io]
          secretName: tipsbot-canary-tls
  persistence:
    data:
      enabled: true
      size: 1Gi
      storageClass: standard-rwo
      accessMode: ReadWriteOnce
      globalMounts:
        - path: /data
    backup:
      enabled: true
      size: 10Gi
      storageClass: standard-rwx
      accessMode: ReadWriteMany
      globalMounts:
        - path: /backup
