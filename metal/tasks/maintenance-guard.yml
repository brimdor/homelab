---
- name: Refuse competing node, package, GPU or reboot changes during maintenance
  ansible.builtin.raw: >-
    if test -e /var/lib/homelab-maintenance/owner.json ||
    test -L /var/lib/homelab-maintenance/owner.json; then
    echo 'Maintenance ownership exists; resume its reviewed controller.' >&2;
    exit 1; fi
  changed_when: false
  tags: always
