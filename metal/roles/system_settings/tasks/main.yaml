- name: Adjust Timezone
  community.general.timezone:
    name: America/Chicago

- name: Enable ICMP Echo (ping)
  ansible.posix.sysctl:
    name: net.ipv4.icmp_echo_ignore_all
    value: "0"
    state: present
    reload: true

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Ensure ICMP is allowed in firewalld
  ansible.posix.firewalld:
    icmp_block: echo-request
    state: disabled
    permanent: true
    immediate: "{{ ansible_facts.services['firewalld.service'].state == 'running' }}"
  when: "'firewalld.service' in ansible_facts.services"

- name: Check if UFW is installed
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: ufw_binary

- name: Report UFW ICMP policy
  ansible.builtin.debug:
    msg: UFW manages ICMP through before.rules; no explicit rule is required.
  when: ufw_binary.stat.exists

- name: Install native SELinux management tools
  ansible.builtin.package:
    name: policycoreutils-python-utils
    state: present
  when: k3s_selinux | default(false)

- name: Install node firmware and disk health packages
  ansible.builtin.package:
    name:
      - microcode_ctl
      - smartmontools
    state: present
  when: host_microcode_early | default(false)

- name: Retain early microcode in future initramfs builds
  ansible.builtin.copy:
    dest: /etc/dracut.conf.d/90-homelab-microcode.conf
    content: |
      early_microcode="yes"
    owner: root
    group: root
    mode: "0644"
  when: host_microcode_early | default(false)

- name: Read configured node kernel arguments
  ansible.builtin.command: grubby --info=ALL
  register: host_kernel_entries
  changed_when: false
  when: host_gds_force | default(false)

- name: Retain the supported GDS mitigation on affected nodes
  ansible.builtin.command: grubby --update-kernel=ALL --args=gather_data_sampling=force
  when:
    - host_gds_force | default(false)
    - host_kernel_entries.stdout_lines | select('match', '^args=') | reject('search', 'gather_data_sampling=force') | list | length > 0
