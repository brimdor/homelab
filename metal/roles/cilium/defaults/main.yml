cilium_repo_url: https://helm.cilium.io
cilium_version: 1.18.16
cilium_namespace: kube-system
cilium_values:
  # Retain the original datapath compatibility during adjacent minor upgrades.
  upgradeCompatibility: "1.15"
  livenessProbe:
    requireK8sConnectivity: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  operator:
    replicas: 1
  kubeProxyReplacement: true
  l2announcements:
    enabled: true
  # Preserve the existing neighbor discovery when the 1.18 default changes.
  l2NeighDiscovery:
    enabled: true
  # TODO the host and port are k3s-specific, generic solution is in progress
  # https://github.com/cilium/cilium/issues/19038
  # https://github.com/cilium/cilium/pull/28741
  k8sServiceHost: 127.0.0.1
  k8sServicePort: 6444
  hubble:
    relay:
      enabled: true
    ui:
      enabled: true
