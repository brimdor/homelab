- name: Bootstrap Python libdnf5 bindings
  ansible.builtin.raw: >-
    rpm -q python3-libdnf5 >/dev/null 2>&1 ||
    dnf install -y python3-libdnf5
  register: libdnf5_bootstrap
  changed_when: libdnf5_bootstrap.stdout | length > 0

- name: Install packages for automatic upgrade
  ansible.builtin.dnf:
    name:
      - dnf-automatic
      - dnf-utils

- name: Copy automatic upgrade config file
  ansible.builtin.copy:
    src: automatic.conf
    dest: /etc/dnf/automatic.conf
    mode: 0644

- name: Enable automatic upgrade service
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    state: started
    enabled: true
