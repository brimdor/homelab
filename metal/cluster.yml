- name: Create Kubernetes cluster
  hosts: metal
  any_errors_fatal: true
  pre_tasks:
    - name: Respect persistent maintenance ownership
      ansible.builtin.import_tasks: tasks/maintenance-guard.yml
      tags: always
  roles:
    - prerequisites
    - k3s
    - automatic_upgrade
  post_tasks:
    - name: Refresh SSH trust after inventory nodes join the cluster
      ansible.builtin.import_tasks: tasks/ssh-trust.yml
      delegate_to: localhost
      connection: local
      become: false
      run_once: true
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        ssh_trust_defer_bootstrap: true
      tags: ssh_trust

- name: Install Kubernetes addons
  hosts: localhost
  roles:
    - cilium
