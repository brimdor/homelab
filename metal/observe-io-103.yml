---
- name: Govern the Issue 103 passive host-service I/O observer
  hosts: bulbasaur
  gather_facts: false
  any_errors_fatal: true
  vars:
    io_capture_action: disable
    ansible_python_interpreter: /usr/bin/python3
  pre_tasks:
    - name: Require the exact reviewed scope
      ansible.builtin.assert:
        that:
          - ansible_limit == 'bulbasaur'
          - inventory_hostname == 'bulbasaur'
          - ansible_host == '10.0.20.13'
          # Owner deferred intermittent I/O investigation outside Issue 103.
          - io_capture_action == 'disable'
        fail_msg: Owner-deferred I/O investigation; this maintenance workflow may only disable observation.
    - name: Respect persistent maintenance ownership
      ansible.builtin.import_tasks: tasks/maintenance-guard.yml
    - name: Verify the existing host identity before installing anything
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -B
          - -c
          - >-
            import pathlib,socket,subprocess,os;
            assert os.geteuid()==0 and socket.gethostname()=='bulbasaur';
            assert pathlib.Path('/etc/machine-id').read_text().strip()=='f61201c3e2ba4b8cbd31e09f77da2ad0';
            assert subprocess.check_output(['findmnt','-n','-o','UUID','/'],text=True).strip()=='2c59d1d1-d2d8-420e-b3a5-d87eb0437823';
            assert subprocess.check_output(['getenforce'],text=True).strip()=='Enforcing'
      changed_when: false
  tasks:
    - name: Install the reviewed observer
      ansible.builtin.copy:
        src: scripts/controlplane_io_capture.py
        dest: /usr/local/libexec/homelab-io-103.py
        owner: root
        group: root
        mode: '0755'
    - name: Declare the passive service
      ansible.builtin.copy:
        dest: /etc/systemd/system/homelab-io-103.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Issue 103 private host-service aggregate I/O evidence
          After=local-fs.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/python3 -B /usr/local/libexec/homelab-io-103.py --seconds 14400
          StateDirectory=homelab-io-103
          StateDirectoryMode=0700
          UMask=0077
          NoNewPrivileges=yes
          PrivateNetwork=yes
          PrivateTmp=yes
          PrivateDevices=yes
          ProtectSystem=strict
          ProtectHome=yes
          ProtectKernelTunables=yes
          ProtectKernelModules=yes
          ProtectKernelLogs=yes
          ProtectControlGroups=yes
          CapabilityBoundingSet=
          RestrictAddressFamilies=AF_UNIX
          Nice=19
          IOSchedulingClass=idle
          CPUQuota=5%
          MemoryMax=64M
          TasksMax=8
          TimeoutStopSec=20
          Restart=no

          [Install]
          WantedBy=multi-user.target
    - name: Declare the calendar without changing Kured or cron
      ansible.builtin.copy:
        dest: /etc/systemd/system/homelab-io-103.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Capture before the unchanged MWF restart window

          [Timer]
          OnCalendar=Mon,Wed,Fri *-*-* 01:45:00 America/Chicago
          AccuracySec=1s
          Persistent=false

          [Install]
          WantedBy=timers.target
    - name: Stop and disable observation before applying qualification
      ansible.builtin.systemd_service:
        name: homelab-io-103.service
        daemon_reload: true
        enabled: false
        state: stopped
    - name: Keep its calendar stopped and disabled
      ansible.builtin.systemd_service:
        name: homelab-io-103.timer
        enabled: false
        state: stopped
    - name: Qualify the published aggregate observer
      when: io_capture_action == 'qualify'
      block:
        - name: Bind a fresh qualification timestamp
          ansible.builtin.command: /usr/bin/python3 -B -c 'import time; print(time.time())'
          register: io_capture_started
          changed_when: false
        - name: Observe existing host-service traffic
          block:
            - name: Start only the published service
              ansible.builtin.systemd_service:
                name: homelab-io-103.service
                state: started
            - name: Collect a brief native sample
              ansible.builtin.pause:
                seconds: 20
            - name: Require the aggregate collector still running
              ansible.builtin.command: systemctl is-active homelab-io-103.service
              changed_when: false
          always:
            - name: Stop and reap the owned qualification
              ansible.builtin.systemd_service:
                name: homelab-io-103.service
                state: stopped
        - name: Accept the actual stopped private evidence
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -B
              - /usr/local/libexec/homelab-io-103.py
              - --accept-after
              - "{{ io_capture_started.stdout }}"
          changed_when: false
        - name: Enable observation on future boots after native acceptance
          ansible.builtin.systemd_service:
            name: homelab-io-103.service
            enabled: true
        - name: Enable the observation calendar after native acceptance
          ansible.builtin.systemd_service:
            name: homelab-io-103.timer
            enabled: true
            state: started
        - name: Start the accepted operational observation window
          ansible.builtin.systemd_service:
            name: homelab-io-103.service
            state: started
      rescue:
        - name: Leave an unaccepted service stopped and disabled
          ansible.builtin.systemd_service:
            name: homelab-io-103.service
            enabled: false
            state: stopped
        - name: Leave an unaccepted calendar stopped and disabled
          ansible.builtin.systemd_service:
            name: homelab-io-103.timer
            enabled: false
            state: stopped
        - name: Preserve the failed qualification as a failure
          ansible.builtin.fail:
            msg: Native aggregate qualification failed; both observer units remain disabled.
