{{- if ne .Release.Namespace "maintenance-valkey-103" }}
{{- fail "synthetic Valkey qualification requires its exclusive namespace" }}
{{- end }}
{{- $legacy := "docker.io/bitnamilegacy/valkey-cluster@sha256:32869e769b7e554219f2ae527b85f4a4739574750beac63b895f5d09fc38f53b" }}
{{- $maintained := "docker.io/valkey/valkey@sha256:0f62bfecc0b713dc2111af3ee307d5cd53c6877b7a112c6143c4de20f1325e4c" }}
{{- if not (has .Values.image (list $legacy $maintained)) }}
{{- fail "unreviewed synthetic Valkey image" }}
{{- end }}
{{- if not (has .Values.node (list "pikachu" "totodile")) }}
{{- fail "unreviewed synthetic Valkey node" }}
{{- end }}
{{- if or (lt (int .Values.partition) 0) (gt (int .Values.partition) 6) }}
{{- fail "unreviewed synthetic Valkey partition" }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: maintenance-valkey-103
  labels:
    maintenance103.eaglepass.io/purpose: synthetic-valkey-six-pvc
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: synthetic-valkey-config
  labels:
    maintenance103.eaglepass.io/purpose: synthetic-valkey-six-pvc
data:
  valkey-default.conf: |
    {{- .Files.Get "configuration/valkey-default.conf" | nindent 4 }}
  ready.sh: |
    #!/bin/sh
    set -eu
    [ "$(valkey-cli --raw -h 127.0.0.1 PING)" = PONG ]
    state=$(valkey-cli --raw -h 127.0.0.1 CLUSTER INFO)
    for field in cluster_state:ok cluster_slots_assigned:16384 cluster_slots_ok:16384 cluster_slots_pfail:0 cluster_slots_fail:0 cluster_known_nodes:6; do
      case "$state" in *"$field"*) ;; *) exit 1 ;; esac
    done
---
apiVersion: v1
kind: Service
metadata:
  name: synthetic-valkey-headless
  labels:
    maintenance103.eaglepass.io/purpose: synthetic-valkey-six-pvc
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    maintenance103.eaglepass.io/purpose: synthetic-valkey-six-pvc
  ports:
    - name: valkey
      port: 6379
    - name: bus
      port: 16379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: synthetic-valkey-isolation
  labels:
    maintenance103.eaglepass.io/purpose: synthetic-valkey-six-pvc
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              maintenance103.eaglepass.io/purpose: synthetic-valkey-six-pvc
      ports: &ports
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 16379
  egress:
    - to:
        - podSelector:
            matchLabels:
              maintenance103.eaglepass.io/purpose: synthetic-valkey-six-pvc
      ports: *ports
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: synthetic-valkey
  labels:
    maintenance103.eaglepass.io/purpose: synthetic-valkey-six-pvc
spec:
  replicas: 6
  serviceName: synthetic-valkey-headless
  podManagementPolicy: Parallel
  minReadySeconds: 3
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: {{ .Values.partition }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  selector:
    matchLabels:
      maintenance103.eaglepass.io/purpose: synthetic-valkey-six-pvc
  template:
    metadata:
      labels:
        maintenance103.eaglepass.io/purpose: synthetic-valkey-six-pvc
      annotations:
        maintenance103.eaglepass.io/generation: {{ .Values.generation | quote }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.node }}
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: [valkey-server, /opt/bitnami/valkey/etc/valkey-default.conf]
          args: [--bind, "0.0.0.0 ::", --protected-mode, "no", --databases, "1", --appendonly, "yes", --cluster-announce-ip, "$(POD_IP)", --aof-load-truncated, "no"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 50Mi
            limits:
              cpu: 500m
              memory: 192Mi
              ephemeral-storage: 2Gi
          ports:
            - name: valkey
              containerPort: 6379
            - name: bus
              containerPort: 16379
          startupProbe:
            exec:
              command: [/bin/sh, -ec, '[ "$(valkey-cli --raw -h 127.0.0.1 PING)" = PONG ]']
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            exec:
              command: [/bin/sh, -ec, '[ "$(valkey-cli --raw -h 127.0.0.1 PING)" = PONG ]']
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: [/bin/sh, /configuration/ready.sh]
            periodSeconds: 2
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /bitnami/valkey/data
            - name: configuration
              mountPath: /configuration
              readOnly: true
            - name: configuration
              mountPath: /opt/bitnami/valkey/etc/valkey-default.conf
              subPath: valkey-default.conf
              readOnly: true
            - name: runtime
              mountPath: /opt/bitnami/valkey/tmp
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: configuration
          configMap:
            name: synthetic-valkey-config
            defaultMode: 0444
        - name: runtime
          emptyDir:
            sizeLimit: 32Mi
        - name: temporary
          emptyDir:
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          maintenance103.eaglepass.io/purpose: synthetic-valkey-six-pvc
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 64Mi
