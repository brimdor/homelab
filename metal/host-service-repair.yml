---
- name: Repair the investigated Docker daemon conflict on Charmander
  hosts: charmander
  gather_facts: false
  become: true
  tasks:
    - name: Reconcile the CLI-owned Docker live-restore directive
      ansible.builtin.import_tasks: roles/docker/tasks/daemon_config.yml

    - name: Require validated reconciliation of the investigated Docker conflict
      ansible.builtin.assert:
        that:
          - (docker_daemon_repair.stdout | from_json).validated
          - (docker_daemon_repair.stdout | from_json).reconciled
        fail_msg: Docker configuration reconciliation was not proven; refusing to start the investigated service.

    - name: Start Docker after its configuration has been validated
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

- name: Retire investigated obsolete system display services on Arcanine
  hosts: arcanine
  gather_facts: false
  become: true
  tasks:
    - name: Reconcile obsolete system display unit retirement
      ansible.builtin.import_tasks: roles/display_config/tasks/retire_system_units.yml
